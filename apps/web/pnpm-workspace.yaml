# 빌드 스크립트 실행 허용 목록. 기본은 false — 필요한 것만 명시적으로 켠다.
allowBuilds:
  # msw 의 postinstall 은 public/mockServiceWorker.js 를 버전에 맞춰 다시 복사한다.
  # 워커 파일을 저장소에 커밋해 두므로 스크립트는 돌리지 않는다.
  # 🚨 msw 버전을 올리면 `pnpm exec msw init public` 를 다시 실행할 것.
  # firebase (#609 웹 푸시). @firebase/util 의 postinstall 은 FIREBASE_WEBAPP_CONFIG 환경변수를 읽어
  # 자동 초기화 설정을 패키지 안에 써 넣는다 — 우리는 설정을 코드에서 넘겨서 쓰지 않는다.
  # protobufjs 의 postinstall 은 버전 표기 경고만 찍는다.
  "@firebase/util": false
  msw: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
