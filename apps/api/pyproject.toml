[project]
name = "ktc4-pusan-3-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    # REVIEW: 이 의존성은 서버가 카카오 API를 호출할 때 사용하며 구현 위치는 integrations로 적혀 있다.
    # `apps/api/CLAUDE.md`에는 외부 인증 API의 위치와 API 레이어의 접근 방향이 정해져 있지 않다.
    # 확인할 내용: 카카오 API 클라이언트를 둘 폴더와 인증 라우터가 접근하는 방향을 결정한다.
    # 검증 테스트 없음: 카카오 API 클라이언트 모듈이 아직 없다.
    # 카카오 호출(app/integrations/kakao)과 테스트 ASGI 클라이언트가 함께 쓴다.
    # 배포되는 서버에도 있어야 하므로 dev 그룹이 아니라 여기 둔다.
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.5",
    "alembic>=1.19.2",
    "pgvector>=0.5.0",
    "openai>=1.60",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/agents/test"]              # Agent 테스트는 소유 디렉토리 안에 둔다
python_files = ["test_*.py", "*_test.py", "test.py"]   # eval 진입점이 test/test.py 라 패턴 추가
markers = ["live: 실제 LLM API 를 호출하는 eval"]
# 라이브 eval 은 API 키와 비용이 필요하므로 기본 실행에서 뺀다.
# 실행하려면 마커를 직접 지정한다 — pytest app/agents/test/test.py -m live
addopts = "-m 'not live'"
