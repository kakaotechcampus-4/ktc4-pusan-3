[project]
name = "ktc4-pusan-3-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    # 카카오 호출(app/integrations/kakao)과 테스트 ASGI 클라이언트가 함께 쓴다.
    # 배포되는 서버에도 있어야 하므로 dev 그룹이 아니라 여기 둔다.
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.5",
    "alembic>=1.19.2",
    "pgvector>=0.5.0",
    "openai>=1.60",
    "tzdata>=2026.3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=5.0.0",
    # FCM 발송(app/integrations/fcm.py)의 서비스 계정 JWT 서명. 토큰 교환 · 발송은 httpx 로 한다.
    "google-auth>=2.40",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    # 약관 원고(마크다운) → 정본 HTML. 새 약관 버전을 만들 때 scripts/render_policy_html.py 가
    # 한 번 쓰고, 결과 HTML 을 저장소에 커밋한다. 서버는 저장된 HTML 을 내줄 뿐이라 배포에 필요 없다.
    "markdown-it-py>=4.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
# tests 를 적지 않으면 ruff 가 서드파티로 보고 import 를 pytest 옆으로 올린다.
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 비동기 테스트와 픽스처가 이벤트 루프 하나를 같이 쓴다. asyncpg 커넥션은 만든 루프에 묶여 있어서,
# 루프를 테스트마다 새로 열면 커넥션 풀을 매번 버려야 한다(tests/conftest.py session 픽스처, #257)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Supervisor eval 진입점이 tests/eval/agents/supervisor/test.py 라 패턴 추가
python_files = ["test_*.py", "*_test.py", "test.py"]
markers = ["live: 실제 LLM API 를 호출하는 eval"]
# 라이브 eval 은 API 키와 비용이 필요하므로 기본 실행에서 뺀다. 실행하려면 마커를 직접 지정한다.
#   pytest tests/eval/agents/supervisor/test.py -m live    Supervisor → Memory → Food
#   pytest tests/eval/agents/memory/test_memory.py -m live  Memory 단독
addopts = "-m 'not live'"
