# 일반 정보 질문(#574)의 코드 문구. Activity · Food · Growth 가 같은 문구를 쓴다.
# 모델을 거치지 않고 화면에 그대로 나간다. 테스트가 글자 단위로 비교한다.
# norm_notice 의 두 번째 문장은 Growth closed.habit_under36 과 말을 맞췄다 — 같은 검진을 두 이름으로 부르지 않는다(#574 리뷰 11-10).

# 질문의 나이가 문서가 다루는 범위(만 0~5세) 밖이거나 거꾸로 쓴 범위
info.out_of_range:
  kind: notice
  template: 지금은 만 5세까지의 일반 자료로만 답할 수 있어요.

# 그 나이와 겹치는 문서 행이 없거나, 안전 조건으로 전부 빠졌다
info.no_rows:
  kind: notice
  template: 이 나이에 맞는 일반 자료가 아직 없어요.

# 모델이 자료로 답할 수 없다고 했다
info.no_match:
  kind: notice
  template: 이 질문에 맞는 자료가 아직 없어요.

# 모델 호출 실패 · 인자 오류 · 검사에 걸려 남는 문장이 없다. 근거 없는 답을 내보내지 않는다
# 검사에 걸려 문장이 다 빠졌을 때도 나가므로 기다리라고 하지 않는다
info.fallback:
  kind: notice
  template: 자료로 답을 만들지 못했어요. 다시 물어봐 주세요.

# 나이별 기준 · 정상 범위를 묻는 질문. 답 앞에 붙는다 — 기준을 정하지 않는다(루트 §1 · §2)
info.norm_notice:
  kind: notice
  template: 아이마다 속도가 달라서 나이별 기준은 알려드리지 않아요. 궁금한 점은 영유아 검진 때 상담해 보세요.
