# 추천 개수 안내 (Tool_공통.md §5-2). 다 채우지 못했을 때 추천과 함께 화면에 그대로 나간다.
# 테스트가 글자 단위로 비교한다. 문구를 바꾸면 Tool_공통.md §5-2 표도 같이 고친다.

# 1 ~ 2개. {count} 는 실제로 나간 추천 수
suggestion.partial:
  kind: notice
  template: 조건에 맞는 추천을 {count}개 준비했어요.

# 0개. 실패가 아니다 — 안전 조건을 통과한 후보가 하나도 없다.
# 0개 문구가 따로 있는 Agent 는 그 문구를 쓴다 (Food 의 pool.empty)
suggestion.empty:
  kind: notice
  template: 조건에 맞는 추천이 없어요.

# 05 가 run_id 로 들어왔는데 그 Agent 를 이어서 만들 맥락이 없다 (맥락 15분 지남 · 서버 재시작 ·
# 24시간 지남 · 그 run 에서 돌지 않은 Agent). 실패가 아니라서 화면은 다시 시도를 띄우지 않는다
suggestion.cannot_resume:
  kind: notice
  template: 이전 요청을 이어서 준비할 수 없어요. 홈에서 다시 골라 주세요.

# 04 Agent 블록의 이유 한 문장 (#227). 개인화 추천 묶음에만 쓴다 — 모델을 거치지 않는다.
# {count} 는 그 묶음의 개인화 추천이 근거로 쓴 아이 기록 수다(같은 기록은 한 번)
suggestion.bundle.personalized:
  kind: reason
  template: 아이 기록 {count}건을 보고 골랐어요.
