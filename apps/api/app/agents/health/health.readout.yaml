# Health 코드 상수 문구 (Health_Tool_명세.md §4). 모델을 거치지 않고 화면에 그대로 나간다.
# 테스트(test_health_readouts.py)가 명세 §4 표와 글자 단위로 비교한다. 문구를 바꾸면 명세도 같이 고친다.
# `{name}` 자리는 코드가 만든 값으로만 채운다 (symptom · n · condition · title · times …).

# ── 증상 반복 안내 (hook) ──
symptom.repeat:
  kind: symptom_repeat
  template: "최근 1주 동안 '{symptom}'이(가) {n}번 기록됐어요. 병원에서 확인해 보시는 게 좋겠어요."
symptom.repeat_condition:
  kind: symptom_repeat
  template: "최근 1주 동안 '{symptom}'이(가) {n}번 기록됐어요. 등록하신 '{condition}'이(가) 있어 병원에서 확인해 보시는 게 좋겠어요."

# ── 검진 · 접종 ──
vaccine.disclaimer:
  kind: checkup_schedule
  template: "이 시기에 권장되는 접종이에요. 실제 접종 기록은 예방접종도우미에서 확인할 수 있어요."
checkup.aged_out:
  kind: checkup_schedule
  template: "영유아 건강검진과 국가예방접종은 만 6세까지예요. 지금은 대상 기간이 끝났어요."
checkup.context_footer:
  kind: checkup_context
  template: "문진표는 보호자가 직접 작성해 주세요. 이 요약은 참고용이에요."

# ── 복약 ──
med.confirm:
  kind: medication_notice
  template: "{title} — {times}에 알려드릴까요? ({starts_on} ~ {ends_on})"
med.update_confirm:
  kind: medication_notice
  template: "{title} 알림을 {times}로 바꿀까요? 확인 전까지는 기존 시각에 알려드려요."
med.notice:
  kind: medication_notice
  template: "{title} — {times}에 알려드릴게요. ({starts_on} ~ {ends_on})"
med.stop_confirm:
  kind: medication_notice
  template: "{title} 복약 알림을 멈출까요? 먹인 기록은 그대로 남아요."
med.stopped:
  kind: medication_notice
  template: "{title} 복약 알림을 멈췄어요. 먹인 기록은 그대로 남아요."
med.stop_kept:
  kind: medication_notice
  template: "{title} 복약 알림은 그대로 둘게요."
dose.status:
  kind: dose_status
  template: "마지막 복용 {last} · 다음 예정 {next} · 오늘 {taken}/{planned}회"
dose.logged:
  kind: dose_status
  template: "{title} 먹인 걸로 기록했어요. ({taken_at})"
dose.skipped:
  kind: dose_status
  template: "{title} 못 먹인 걸로 기록했어요. ({slot})"
dose.duplicate:
  kind: ask
  template: "오늘 예정된 복용이 이미 모두 기록돼 있어요. 추가로 남길까요?"

# ── 열 · 응급 ──
fever.no_record:
  kind: fever_timeline
  template: "체온 기록이 없어요. 재실 때 남겨 두시면 정리해 드릴게요."
emergency:
  kind: emergency
  template: "지금 바로 119에 연락하거나 가까운 응급실로 가세요."

# ── 전달 서류 ──
notice.signature:
  kind: med_notice_form
  template: "보호자 확인 후 서명해 주세요."
notice.no_active_med:
  kind: med_notice_form
  template: "지금 등록된 복약 일정이 없어요."
prescription.low_confidence:
  kind: prescription_draft
  template: "흐리게 읽힌 칸이 있어요. 확인하고 채워 주세요."
prescription.not_found:
  kind: prescription_draft
  template: "처방전 정보를 찾지 못했어요."

# ── 닫힘 · 기록 없음 · 조회 실패 ──
blocked.consent:
  kind: blocked
  template: "건강 기록을 보려면 건강정보 동의가 필요해요."
visit.no_record:
  kind: symptom_timeline
  template: "최근 2주 동안 건강 기록이 없어요."
place.unavailable:
  kind: place_list
  template: "병원 정보를 불러오지 못했어요. 응급 시 119에 연락하세요."
safety.unavailable:
  kind: caution
  template: "알레르기 정보를 불러오지 못했어요. 아래 정리는 그것 없이 만든 거예요."
