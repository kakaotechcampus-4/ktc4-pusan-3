# Activity 코드 상수 문구 (공통규약 §10). 모델을 거치지 않고 화면에 그대로 나간다.
# 테스트가 글자 단위로 비교한다. 문구를 바꾸면 설계 문서도 같이 고친다.

# 알레르기 조회에 실패했다. 재료 후보만 빼서는 환경 알레르기를 못 막아서 전부 닫는다 (D7)
blocked.safety:
  kind: blocked
  template: 지금 알레르기 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.

# 식품 사전에 없는 알레르기 이름(꽃가루 · 라텍스)이 active면 한 줄 (D7).
# 뺄 놀이를 코드가 못 정해서 보호자가 적은 이름을 보여 준다. Growth 와 같은 문구 · 같은 판정이다
caution.non_food_allergy:
  kind: notice
  template: 등록된 알레르기({label})가 있어요. 장소랑 재료를 한 번 확인해 주세요.

# 보호자가 요청에 쓴 음식이 이 아이에게 막혔다 — 그런 놀이는 빼고 골랐다고 알린다 (#582).
# Food 의 meal.request_conflict · meal.request_age_block 과 같은 방식이다: 보호자가 쓴 어절({food})만
# 싣고 등록한 알레르기 이름은 싣지 않는다. 모델 입력에도 가지 않는다. 빼 달라는 말("땅콩 빼고")은
# 안내하지 않는다. 추천 개수와 상관없이 붙는다 — 0개여도 왜 없는지 이 줄이 말한다
request.food_conflict:
  kind: notice
  template: "요청하신 {food}에는 등록해 두신 {what}와 겹치는 것이 있어서 그런 놀이는 빼고 골랐어요."
request.food_age_block:
  kind: notice
  template: "요청하신 {food}{은는} {when} 먹이지 않아서 그런 놀이는 빼고 골랐어요."

# ── 장소 안내 (#516). 장소 이름이 붙은 추천에만 `place_notice` 칸으로 싣는다 ──
# 문장(content)에 섞지 않는다 — 화면이 제안 문장 아래 한 줄로 세운다. 적재한 뒤 문을 닫았을 수 있어
# 운영 여부는 늘 확인해 달라고 한다. 기준일자는 공공데이터의 데이터기준일자다
place.notice:
  kind: notice
  template: 공공데이터 기준 {year}년 {month}월이에요. 가기 전에 운영 여부를 확인해 주세요.
place.notice_undated:
  kind: notice
  template: 가기 전에 운영 여부를 확인해 주세요.
# 어린이놀이시설(키즈카페 · 육아종합지원센터). 공공 시설도 이용료 · 예약이 있는 곳이 많다.
# 데이터기준일자 칸이 없는 출처라 날짜는 붙지 않는다. 출처는 붙인다 — 안 보이면 왜 이 가게가
# 나왔는지 몰라 광고처럼 읽힌다 (#600 PM)
place.notice_facility:
  kind: notice
  template: 공공데이터에 있는 시설이에요. 가기 전에 운영 여부와 이용료를 확인해 주세요.
# 행사(한국관광공사 TourAPI 축제공연행사). 출처를 밝힌다 — 왜 이 행사가 나왔는지 안 보이면
# 광고처럼 읽힌다(#600 PM). 기간 · 관람 연령은 주최 측이 바꾸므로 가기 전에 확인해 달라고 한다
place.notice_culture:
  kind: notice
  template: 한국관광공사 관광정보에 있는 곳이에요. 운영 시간 · 휴관일 · 관람료는 가기 전에 확인해 주세요.
place.notice_event:
  kind: notice
  template: 한국관광공사 행사 정보예요. 일정과 관람 연령이 바뀔 수 있으니 가기 전에 확인해 주세요.
# 보호자가 말한 지역을 못 찾았다(모르는 이름 · 여러 곳인데 위치가 없음 · 시도만). 비슷한 곳으로
# 짐작하지 않고 장소 없이 골랐다고 알린다. run 에 한 줄이다 (`areas.py`)
events.no_new:
  kind: notice
  template: 앞에서 보여 드린 행사 말고는 그날 열리는 행사를 더 찾지 못했어요.

events.pending:
  kind: notice
  template: 행사 일정을 아직 확인하고 있어서 이번 추천에는 행사를 넣지 못했어요. 잠시 뒤에 다시 물어봐 주세요.

# 행사를 물었는데 그날 열리는 행사가 없었다. 없다고 말하지 않으면 행사 조회가 고장 난 것처럼
# 보인다(11-11 운영). 보호자 위치에서 찾았으면 찾은 반경({km}, `EVENT_MAX_RADIUS_M`)과 다른 지역을
# 찾는 법을 같이 알린다 — "근처" 만으로는 반경 밖 도시를 찾지 않는다
events.none_near:
  kind: notice
  template: "가까운 곳({km}km 안)에서 그날 열리는 행사를 찾지 못했어요. 다른 지역은 '김해 행사'처럼 지역 이름을 말씀해 주시면 찾아볼게요."

events.none_area:
  kind: notice
  template: 말씀하신 지역에서 그날 열리는 행사를 찾지 못했어요.

events.unavailable:
  kind: notice
  template: 행사 정보를 지금 불러오지 못해서 행사 없이 골랐어요.

place.location_missing:
  kind: notice
  template: "위치를 허용하거나 지역(예: 부산 해운대구)을 말씀해 주시면 행사 · 장소도 찾아볼게요."

place.area_unknown:
  kind: notice
  template: 말씀하신 지역을 찾지 못해 장소 없이 골랐어요. 시·도와 구·군까지 말씀해 주시면 그 지역 장소도 찾아볼게요.

# ── 날씨 안내 (weather.py 의 화면 문구 키). 날씨 판정이 붙이고 추천과 함께 화면에 나간다 ──
# 무엇을 확인 못 했는지는 야외를 막아도 알린다 (D8). 예보 · 특보를 못 읽은 날은 바깥을 막지 않고
# 확인을 맡긴다 — 바깥 놀이가 결과에 있을 때만 붙는다 (#612 멘토 리뷰)
weather.unchecked:
  kind: notice
  template: 날씨를 확인하지 못했어요. 바깥 놀이라면 나가기 전에 날씨와 특보를 한 번 봐 주세요.
weather.not_asked:
  kind: notice
  template: 날씨는 확인하지 않았어요. 바깥 놀이라면 나가기 전에 날씨를 한 번 봐 주세요.
weather.air_unchecked:
  kind: notice
  template: 미세먼지는 확인하지 못했어요.
weather.uv_unchecked:
  kind: notice
  template: 자외선은 확인하지 못했어요.
weather.outdoor_blocked:
  kind: notice
  template: 오늘은 바깥 활동이 어려운 날이라 실내 놀이만 골랐어요.
weather.after_sunset:
  kind: notice
  template: 지금은 어두워서 놀이터는 뺐어요.
weather.heat_advisory:
  kind: notice
  template: 폭염주의보가 내려져 있어요. 한낮은 피해 주세요.
weather.cold_advisory:
  kind: notice
  template: 한파주의보가 내려져 있어요. 따뜻하게 입혀 주세요.
weather.air_bad:
  kind: notice
  template: 미세먼지가 나빠요. 바깥 활동은 짧게 해 주세요.
weather.ozone_advisory:
  kind: notice
  template: 오존이 높아요. 오후 바깥 활동은 짧게 해 주세요.
weather.uv_very_high:
  kind: notice
  template: 자외선이 매우 높아요. 그늘과 모자를 챙겨 주세요.
weather.rain_likely:
  kind: notice
  template: 비가 올 수 있어요. 우산을 챙겨 주세요.
