# Food 의 코드 상수 문구 (Food_Tool_명세.md §4). 모델을 거치지 않고 화면에 그대로 나간다.
# 테스트(test_food_readouts.py)가 명세 §4 표와 글자 단위로 비교한다. 문구를 바꾸면 명세도 같이 고친다.
# `{menu}` · `{recorded}` · `{date}` · `{slot}` · `{label}` 자리는 코드가 만든 값으로만 채운다.

