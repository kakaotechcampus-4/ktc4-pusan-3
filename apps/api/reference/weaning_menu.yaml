# 월령별 이유식 추천 식단 — 이유기(4–11개월) 식단 추천의 후보 표 (#399)
#
# 이유기 아이의 식단 추천은 레시피북(recipe_catalog)을 읽지 않고 이 표에서 그 달 단계 행만 후보로 삼는다.
# 읽는 쪽은 `app/agents/food/weaning_menu.py`.
#
# 출처 — 기관 자료가 아니다
#   공개된 이유식 식단 여러 개를 팀이 찾아보고, 염분이 높지 않은 메뉴를 골라 직접 정리한 표다.
#   작성 nnhhlee, 2026-11-09. 한 곳의 자료를 옮긴 것이 아니고, 정리한 원고에는 참고한 페이지 주소가 적혀
#   있지 않다. 찾으면 여기에 더한다.
#   그래서 source 는 기관이 아니라 "아이캐치 서비스 일반추천" 이고, 05 문서 카드와 안내 문구
#   (meal.menu_weaning)도 "서비스가 정리한 식단" 이라고만 밝힌다. 기관 근거는 월령 경계 하나뿐이다
#   (아래 단계 · 월령).
#
# 🚨 알레르기 · 연령 판정은 코드가 한다 — 이 표의 행도 `filter_food_safety` 를 통과한 것만 풀에 든다.
#    allergen_codes 는 그 근거 중 하나일 뿐이다 (읽는 쪽이 이름 · 재료를 사전으로 훑은 코드와 합친다).
#    테스트가 menu_codes(이름 + 재료) ⊆ allergen_codes 를 건다.
#
# 검수 — 출처 기관이 없어서 사람 검수가 유일한 안전장치다. 작성자와 다른 사람이 메뉴 · 월령 · 재료 ·
# 알레르기 코드를 이 표와 대조한 뒤 행마다 status: approved 와 reviewed_by · reviewed_at 을 채운다.
# 서비스는 approved 만 풀과 근거 카드에 쓴다(draft · retired 는 쓰지 않는다). 작성자 · 검수자는
# GitHub 아이디로 적는다.
#
# 대조 결과 (#843 리뷰, 03leedo, 2026-11-10): 30행의 메뉴 · 월령 · 재료 · 알레르기 코드를 표와 대조했고
# 12개월 전 금지 식품(꿀 · 생우유 · 소금 간)은 없다. 25행이 approved 이고 5행은 보류(draft)다.
#   - 참깨고구마죽 · 참깨연두부무른밥: 코드가 빈 것은 맞다(19종 밖). 등록한 참깨 알레르기는 안전 용어 사전
#     (food_safety_terms 참깨)이 거른다. 영아라 재료를 "참깨(간 것)" 로 고쳤으니 다시 대조한 뒤 올린다.
#   - 흰살생선죽 · 흰살생선애호박죽 · 흰살생선애호박무른밥: 생선 이름이 없어서 보호자가 등록한 생선
#     알레르기(예: 가자미)와 대조가 안 된다. 대구살죽처럼 생선 이름으로 바꾼 뒤 다시 대조한다.
#     (테스트가 "흰살생선" 이 든 행은 approved 가 아니라고 건다.)
#
# 단계 · 월령 — min_month 이상 max_month 미만. food_doc.yaml 의 질감 행(m4_5 · m6_7 · m8_11 .texture)과
#   같은 경계다. 시작 시기는 한국소비자원(이유식은 4~6개월에 시작), 질감 진행은 뉴질랜드 지침을 따른다.
#   그래야 guide_weaning_stage 안내와 식단 추천이 같은 달에 같은 질감을 말한다.
#   초기 early 4–5개월 (min 4 · max 6)  puree
#   중기 mid   6–7개월 (min 6 · max 8)  mashed
#   후기 late  8–11개월 (min 8 · max 12) minced
#   이 경계가 test_weaning_menu.py 에서 food_doc 질감 행과 같은지 대조된다. age_gates.yaml 의
#   infant_weaning 4 · toddler 12 와도 맞다.
#
# 넣지 않은 것
#   - 김가루미음: 조미 김은 소금이 들어 있어 첫 이유식 행으로 두지 않는다. 무조미 김으로 정리되면 더한다.
#   - 완료기(12–15개월) 진밥: 12개월부터는 toddler 라 레시피북 경로다.
#
# 주재료(main_ingredients)는 쌀을 뺀다(쌀미음만 쌀). 모든 행에 쌀이 있어서 넣으면
# "같은 주재료 2개 이하" 샘플 제한이 풀을 2개로 줄인다.
