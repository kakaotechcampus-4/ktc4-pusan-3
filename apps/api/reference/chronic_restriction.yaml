source: 질환 정의상 해당 식품을 배제하는 항목만. 관리·조절이 필요한 질환은 담지 않는다
version: "1"
fetched_at: 2026-09-28
# 담지 않기로 한 것 — 추가하지 말 것. 코드가 의료 판단을 하게 된다.
#   당뇨 → 설탕 · 신장질환 → 단백질 · 고혈압 → 나트륨 · 체중 관련 무엇이든
#   새로 넣고 싶은 항목이 있으면 의료 검수를 거친다.
