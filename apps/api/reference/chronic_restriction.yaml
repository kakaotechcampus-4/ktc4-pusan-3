source: 질환 정의상 해당 식품을 배제하는 항목만. 관리·조절이 필요한 질환은 담지 않는다
version: "1"
fetched_at: 2026-09-28
# 담지 않기로 한 것 — 추가하지 말 것. 코드가 의료 판단을 하게 된다.
#   당뇨 → 설탕 · 신장질환 → 단백질 · 고혈압 → 나트륨 · 체중 관련 무엇이든
#   새로 넣고 싶은 항목이 있으면 의료 검수를 거친다.
# codes 는 질환 정의상 통째로 빼는 19종 코드다(#258). foods 만으로는 목록에 없는 같은 성분 음식
# (버터 · 소면)이 빠진다. 셀리악병은 밀 · 보리 · 호밀의 글루텐을 뺀다 — 귀리는 섞여 들어오는 일이
# 잦아 같이 뺀다.
# labels 에는 진단서 · 검사지의 영어 이름과 줄여 쓴 이름(셀리악)도 둔다.
restrictions:
  - labels: [유당불내증, 유당 불내증, 젖당불내증, lactose intolerance, lactose]
    codes: [2]
    foods: [우유, 유제품, 분유, 치즈, 요구르트, 생크림]
    guards: []
  - labels: [갈락토스혈증, galactosemia, galactosaemia]
    codes: [2]
    foods: [우유, 유제품, 분유, 치즈, 요구르트, 생크림]
    guards: []
  - labels: [셀리악병, 실리악병, 셀리악, 실리악, 글루텐불내증, 글루텐 불내증, celiac, coeliac, celiac disease, coeliac disease]
    codes: [6]
    foods: [밀, 밀가루, 글루텐, 빵, 국수, 라면, 수제비, 부침가루, 튀김가루, 보리, 호밀, 맥아, 엿기름, 귀리, 오트밀, 오트, 스펠트]
    guards: [밀크, 밀키, 밀감, 글루텐 프리, 무글루텐, 보리새우]
