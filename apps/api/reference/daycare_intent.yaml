# 급식 갱신 · 삭제 가드 — 보호자 말이 "급식이 실제로 바뀌었다" 는 말인지 코드가 본다.
# 정본은 docs/agents/food/Food_Tool_명세.md 급식 갱신 · 삭제 표.
#
# 🚨 급식 갱신은 모델이 tool 을 꼭 부른다(tool_choice=required). 묻는 말 · 가정도 갱신 · 삭제로 올 수
#    있어서, 되돌릴 수 없는 삭제를 모델 판단에 맡기지 않는다(루트 CLAUDE.md §3).
# 🚨 비교는 공백을 뺀 원문으로 한다. 목록에 없어서 막히는 쪽(되묻지 않고 그대로 둠)은 안전하고,
#    목록이 넓어서 지우는 쪽은 되돌릴 수 없다 — 넓히기 전에 그 말로 지워도 되는지 본다.

source: docs/agents/food/Food_Tool_명세.md 급식 갱신 · 삭제 가드
version: "2"
fetched_at: 2026-11-10

# 삭제는 이 말이 있어야 한다 — 어린이집 · 유치원을 빠지거나 그 끼니가 없었다는 말
absence:
  - 빠지
  - 빠져
  - 빠진
  - 빠졌
  - 결석
  - 안가
  - 못가
  - 안갔
  - 못갔
  - 쉬
  - 휴원
  - 방학
  - 안보내
  - 가정보육
  - 결식
  - 없었
  - 없대
  - 없어
  - 없다
  - 안나왔
  - 안나와

# 묻는 말 — 원문에 물음표가 있거나 마지막 어절이 이 말로 끝난다. 갱신 · 삭제 둘 다 막는다
question_endings:
  - 니
  - 나요
  - 까
  - 까요
  - 냐
  - 는지
  - 을지

# 교체 — 넣을 메뉴만 말했을 때 이 말이 있으면 무엇 대신인지 되묻고, 없으면 그날 급식에 더한다
# ("새우볶음밥 먹었대"). 목록이 넓으면 되묻기가 늘 뿐이고, 좁으면 빼야 할 메뉴가 남는다
replacement:
  - 대신
  - 대체
  - 말고
  - 빼고
  - 바뀌
  - 바뀐
  - 바꼈
  - 바꿔
  - 바꾼
  - 바꿨
  - 바꾸
  - 교체

# 가정 · 짐작 — 어절이 이 말로 끝나거나(조건) 원문에 이 말이 있다. 삭제만 막는다
conditional_endings:
  - 면
  - 거든
uncertain:
  - 수도
  - 것같
  - 지도몰
  - 려나
