# food_doc 시드 — 이유식 단계 · 식품군 도입 · 식사 태도 문서 행 (own_table §4 · RAG_plan Food 절 · #337)
#
# 🚨 사실만 읽고 문장은 새로 쓴다. 원문 문장을 옮기지 않는다 (RAG_plan §0, 한국어 원문과 8어절 이상 일치 금지).
#    영문 원문은 문장을 번역해 옮기지 않는다.
# 🚨 발달 이정표 · 체중 기준 · 알레르기 식품 도입 시기 · 연령 금지 식품 안내 · 보충제 · 증상 판단 ·
#    수치를 쓰지 않는다 (#337 "넣지 않는 것").
#
# 출처 기준 (#337): 상업적 이용과 변경(다시 쓰기)이 둘 다 허락된 것만 행 출처로 쓴다.
#   Ministry of Health (New Zealand)   「Healthy Eating Guidelines for New Zealand Babies and Toddlers
#                                       (0–2 years old)」 2021. CC BY 4.0 (license_basis: cc_by)
#                                       https://creativecommons.org/licenses/by/4.0/ — 원문을 줄이고
#                                       한국어로 다시 썼다(변경 표시). 표시는 05 응답이 한다: 원래 기관 ·
#                                       제목 뒤에 "번역·재구성함 · CC BY 4.0 (주소)" 가 붙고(public_doc_source),
#                                       원문 링크는 source_url 칸으로 나간다
#   한국소비자원                        「영유아 이유식 안전실태조사」 2023 붙임4. 공공누리 제1유형 (kogl_1)
#   교육부                              2024 개정 표준보육과정(교육부고시 제2024-23호) · 2019 개정
#                                       누리과정(교육부 고시 제2019-189호). 고시 (public_law) —
#                                       국가법령정보센터 본문
#   Department for Education (England) 「Early Years Foundation Stage nutrition guidance」 2025년 5월 (#510).
#                                       Open Government Licence v3.0 (license_basis: ogl_3). 표시는 05 응답이 한다:
#                                       원래 기관 · 제목 뒤에 필수 영문 문장과 라이선스 주소가 붙는다(public_doc_source).
#                                       meal_pattern 에 쓴다. 외부 사이트 레시피 · 로고 · 제3자 자료는 쓰지 않는다
#   NHS (영국) 웹사이트 「Fussy eaters」 · 「Young children and food: common questions」 (#510).
#                                       OGL v3.0 (license_basis: ogl_3). feeding_tip 에만 쓴다.
#                                       🚨 우리가 번역 · 각색한 글이라 NHS 이용 약관 3.6(b) 가 적용된다 — 표준 OGL 문장만 쓰고
#                                       NHS 를 출처로 밝히지 않는다. 그래서 YAML 의 source_org · source_title · source_url 에는
#                                       실제 원문을 남기고(내부 추적용), 05 응답과 Agent 입력에는 표준 문장만 나간다
#                                       (public_doc_source). 제목 · 본문에도 "NHS 에 따르면" 같은 표시를 쓰지 않는다.
#                                       확인일 2026-11-04: 3.6(b) 는 그대로다. 약관 페이지가 아직 "Next review due 12 January
#                                       2024" 로 적혀 있어 행을 쓸 때 다시 읽었다. 3.10 — NHS 콘텐츠 접근에 따로 요금을 매기지
#                                       않는다(이 서비스는 NHS 문장 이용에 별도 요금을 붙이지 않는다). 로고 · 이미지 · 상표는
#                                       OGL 밖이라 쓰지 않는다. 원문 페이지 검토 예정일 Fussy eaters 2026-11-13 — 그 뒤 원문이
#                                       바뀌었는지 검수자가 다시 본다
# 뉴질랜드 2–18세 지침(2012, 2015 개정)은 행 출처로 쓰지 않았다 — health.govt.nz 가 자동 내려받기를 막아 원문을 열지
# 못했고, 검색 결과로는 보건부가 이 지침을 재검토 중이라 최신성을 확인할 수 없었다. 확인되면 36–71개월 행의 교차 확인으로 더한다.
# 일본 가이드는 행을 만들지 않았다 (원본 URL 404, #510 Part F) — pdl_1 값만 있다.
# 미국 연방기관 자료(CDC · USDA WIC · 미국 식생활지침)는 검수 대조용이라 행 출처로 달지 않는다.
#
# 행 칸 — 공통 칸은 RAG_plan §1, Food 칸은 own_table §4.
#   row_type        weaning_stage · weaning_ingredient · meal_pattern · nutrient_note · feeding_tip
#   texture         이유기 행만. puree · mashed · minced · soft_pieces · regular
#   food_groups     grains · meat_fish_egg_legumes · vegetables · fruits · dairy · fats_sugars (잠정, #337)
#   nutrients       nutrient_note 만
#   allergen_codes  제목 · 본문에 나오는 19종 코드를 다 적는다. 조회 뒤 filter_food_safety 가 이 코드로 거른다
#
# 단계 — weaning_stage 는 4–5 / 6–7 / 8–11 개월 (min_month 이상 max_month 미만).
#   시작 시기는 한국소비자원(4~6개월), 질감 진행은 뉴질랜드 지침을 따랐다 (#337).
#
# 검수 — 작성자와 다른 사람이 원문을 펴 놓고 사실 · 월령 · 출처 위치를 확인한 뒤
# status: approved 와 reviewed_by · reviewed_at 을 채운다. 서비스는 approved 만 쓴다.
# 작성자 · 검수자는 GitHub 아이디로 적는다.
#
# TEMP(#434): 배포 테스트에서 일반 추천을 열려고 모든 행을 status: approved · reviewed_by: admin 으로
# 임시로 올렸다. 실제 검수가 아니다. 🚨 10/20 전에 작성자가 아닌 사람이 원문을 펴 놓고 사실 · 월령 · 출처
# 위치를 확인한 뒤 reviewed_by · reviewed_at 을 그 사람의 GitHub 아이디 · 검수일로 바꾼다.
# 통과하지 못한 행은 status: draft 로 되돌리고 reviewed_by · reviewed_at 을 지운다.
#
# 원문은 저장소 밖(팀 드라이브)에 두고, 받은 날의 라이선스 표시(판권면 · 공공누리 표시 캡처)도 같이 둔다.
#   뉴질랜드 지침 PDF (위 source_url, 2026-10-12 받음)
#     sha256 7f890b302dc5c0133765dcf67e7d2a658808aea02d32a4a40e2ee9b9b2f6b237 — 판권면 2쪽
#   한국소비자원 보고서 PDF (상세 페이지 첨부, 2026-10-12 받음)
#     sha256 1236ac7f6adb7f837ffb28bab8dc64f73076b2fa6fb190efc461f54148130d11 — 붙임4 는 PDF 26쪽(인쇄 22쪽)
#   DfE EYFS nutrition guidance PDF (위 source_url, 2025년 5월판, 2026-11-04 받음)
#     sha256 1e156c5e87e7e5200c9dfbbc7e2f1a9a9c463145427370dee6fe507da722da97 — 인쇄 쪽과 PDF 쪽이 같다.
#     라이선스 표시(OGL v3.0, Crown copyright 2025)는 39쪽
#   NHS 웹페이지 (2026-11-04 받은 HTML — 페이지가 바뀌면 해시도 달라진다)
#     Fussy eaters (Page last reviewed 13 November 2023)
#       sha256 08bca3eb19141c0956a2544dc62206956b7aab44bd220d5123d6b2f9d99d5aed
#     Young children and food: common questions (Page last reviewed 28 April 2026)
#       sha256 d154bf10dcac4d3b04ee490397362f047dcd2178c4a159f39cf796ddc2231705
#     이용 약관 https://www.nhs.uk/our-policies/terms-and-conditions/ — 3.6(b) · 3.10
#       sha256 accea34ff5bf2283fde877d8245d614511bad0c05a495689da6832ab230d53a9
#
# 행마다 테스트가 보는 것 (tests/unit/agents/food/test_food_doc_seed.py)
# - allergen_codes 가 제목 · 본문을 Food 사전으로 훑은 코드를 다 덮는다
# - 행의 min_month 에서 연령 규칙(food_safety_terms.yaml) 중 block 에 걸리지 않는다 (caution 은 통과)
# - 평가 표현 · 발달 이정표 · 영양 수치 · 처방 표현 없음
# - row_type 별 칸과 월령 (이유기 4–12, meal_pattern · nutrient_note 12+, texture · nutrients 는 정해진 행만)
# - 출처가 위 다섯 곳 중 하나이고 license_basis 가 맞다
# - meal_pattern 은 12–35개월 · 36–71개월 구간마다 15행(끼니 3 · 간식 2 · 식품군 5 · 마실 것 1 · 예시 식사 4),
#   신규 행은 전부 draft 이고 source_locator 가 있다. NHS 행은 공개 출처에서 이름 · 주소가 가려진다
# - weaning_stage 가 4–11개월을 빈틈없이 덮는다

source: Ministry of Health (New Zealand) 2021 (CC BY 4.0) · 한국소비자원 2023 (공공누리 제1유형) · 교육부 고시 · DfE 2025 (OGL v3.0) · NHS (OGL v3.0, 공개 출처 비공개) — 행마다 source_* 칸
