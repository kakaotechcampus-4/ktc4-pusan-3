# food_doc 시드 — 이유식 단계 · 식품군 도입 · 식사 태도 문서 행 (own_table §4 · RAG_plan Food 절 · #337)
#
# 🚨 사실만 읽고 문장은 새로 쓴다. 원문 문장을 옮기지 않는다 (RAG_plan §0, 한국어 원문과 8어절 이상 일치 금지).
#    영문 원문은 문장을 번역해 옮기지 않는다.
# 🚨 발달 이정표 · 체중 기준 · 알레르기 식품 도입 시기 · 연령 금지 식품 안내 · 보충제 · 증상 판단 ·
#    수치를 쓰지 않는다 (#337 "넣지 않는 것").
#
# 출처 기준 (#337): 상업적 이용과 변경(다시 쓰기)이 둘 다 허락된 것만 행 출처로 쓴다.
#   Ministry of Health (New Zealand)   「Healthy Eating Guidelines for New Zealand Babies and Toddlers
#                                       (0–2 years old)」 2021. CC BY 4.0
#                                       https://creativecommons.org/licenses/by/4.0/ — 원문을 줄이고
#                                       한국어로 다시 썼다(변경 표시). license_basis 는 값 집합에 CC BY 가
#                                       없어서 fact_rewrite 로 적는다
#   한국소비자원                        「영유아 이유식 안전실태조사」 2023 붙임4. 공공누리 제1유형 (kogl_1)
#   교육부                              2024 개정 표준보육과정(교육부고시 제2024-23호) · 2019 개정
#                                       누리과정(교육부 고시 제2019-189호). 고시 (public_law) —
#                                       국가법령정보센터 본문
# 미국 연방기관 자료(CDC · USDA WIC · 미국 식생활지침)는 검수 대조용이라 행 출처로 달지 않는다.
#
# 행 칸 — 공통 칸은 RAG_plan §1, Food 칸은 own_table §4.
#   row_type        weaning_stage · weaning_ingredient · meal_pattern · nutrient_note · feeding_tip
#   texture         이유기 행만. puree · mashed · minced · soft_pieces · regular
#   food_groups     grains · meat_fish_egg_legumes · vegetables · fruits · dairy · fats_sugars (잠정, #337)
#   nutrients       nutrient_note 만
#   allergen_codes  제목 · 본문에 나오는 19종 코드를 다 적는다. 조회 뒤 filter_food_safety 가 이 코드로 거른다
#
# 단계 — weaning_stage 는 4–5 / 6–7 / 8–11 개월 (min_month 이상 max_month 미만).
#   시작 시기는 한국소비자원(4~6개월), 질감 진행은 뉴질랜드 지침을 따랐다 (#337).
#
# 검수 — 작성자와 다른 사람이 원문을 펴 놓고 사실 · 월령 · 출처 위치를 확인한 뒤
# status: approved 와 reviewed_by · reviewed_at 을 채운다. 서비스는 approved 만 쓴다.
# 작성자 · 검수자는 GitHub 아이디로 적는다.
#
# 원문은 저장소 밖(팀 드라이브)에 두고, 받은 날의 라이선스 표시(판권면 · 공공누리 표시 캡처)도 같이 둔다.
#   뉴질랜드 지침 PDF (위 source_url, 2026-10-12 받음)
#     sha256 7f890b302dc5c0133765dcf67e7d2a658808aea02d32a4a40e2ee9b9b2f6b237 — 판권면 2쪽
#   한국소비자원 보고서 PDF (상세 페이지 첨부, 2026-10-12 받음)
#     sha256 1236ac7f6adb7f837ffb28bab8dc64f73076b2fa6fb190efc461f54148130d11 — 붙임4 는 PDF 26쪽(인쇄 22쪽)
#
# 행마다 테스트가 보는 것 (tests/unit/agents/food/test_food_doc_seed.py)
# - allergen_codes 가 제목 · 본문을 Food 사전으로 훑은 코드를 다 덮는다
# - 행의 min_month 에서 연령 규칙(food_safety_terms.yaml) 중 block 에 걸리지 않는다 (caution 은 통과)
# - 평가 표현 · 발달 이정표 · 영양 수치 · 처방 표현 없음
# - row_type 별 칸과 월령 (이유기 4–12, meal_pattern · nutrient_note 12+, texture · nutrients 는 정해진 행만)
# - 출처가 위 세 곳 중 하나이고 license_basis 가 맞다
# - weaning_stage 가 4–11개월을 빈틈없이 덮는다

source: Ministry of Health (New Zealand) 2021 (CC BY 4.0) · 한국소비자원 2023 (공공누리 제1유형) · 교육부 고시 — 행마다 source_* 칸
version: "2026.1-draft"
fetched_at: 2026-10-12

# 출처 칸 묶음. 행은 `<<: *nz` 처럼 끌어다 쓰고 source_locator 만 따로 적는다.
# source_locator 의 쪽 번호는 원문에 인쇄된 쪽이다 (PDF 쪽 번호와 다르다)
origins:
  nz: &nz
    source_title: Healthy Eating Guidelines for New Zealand Babies and Toddlers (0–2 years old)
    source_org: Ministry of Health (New Zealand)
    source_year: 2021
    source_url: https://www.health.govt.nz/system/files/2021-09/healthy-eating-guidelines-for-new-zealand-babies-and-toddlers-nov21-v3.pdf
    license_basis: fact_rewrite  # CC BY 4.0 — 머리말 참고
  kca: &kca
    source_title: 영유아 이유식 안전실태조사
    source_org: 한국소비자원
    source_year: 2023
    source_url: https://www.kca.go.kr/smartconsumer/sub.do?cate=00000056&menukey=7301&mode=view&no=1003447270
    license_basis: kogl_1
  draft: &draft
    status: draft
    authored_by: nnhhlee
    version: 1

rows:
  # ── weaning_stage — 시작 · 질감 · 먹이는 방법 ──────────────────────────────
  - doc_key: food.weaning.stage.start
    row_type: weaning_stage
    title: 이유식 시작 시기
    body: 이유식은 생후 4~6개월 사이에 시작한다.
    min_month: 4
    max_month: 7
    tags: [weaning, start, timing]
    texture: puree
    <<: [*kca, *draft]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.weaning.stage.m4_5.texture
    row_type: weaning_stage
    title: 6개월 전에 시작할 때의 질감
    body: >-
      6개월이 되기 전에 이유식을 시작했다면 아주 묽게 간 음식부터 준다. 평소 먹던 것보다 조금 걸쭉한
      정도에서 출발해 삼키는 데 익숙해지게 한다.
    min_month: 4
    max_month: 6
    tags: [weaning, texture, puree, early_start]
    texture: puree
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, Starting out (p.28)

  - doc_key: food.weaning.stage.not_before_4
    row_type: weaning_stage
    title: 4개월 전에는 시작하지 않는다
    body: >-
      생후 4개월 전에 이유식을 시작하는 것은 이르다. 그 무렵에는 소화 기관과 콩팥이 평소 먹던 것 말고
      다른 음식을 받아들일 준비가 덜 되어 있다.
    min_month: 4
    max_month: 6
    tags: [weaning, start, timing, early_start]
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Reasons for the recommendations (p.23)

  - doc_key: food.weaning.stage.first_spoon
    row_type: weaning_stage
    title: 처음 떠먹이는 방법
    body: >-
      아기가 편안하고 기분이 좋을 때 시작한다. 안거나 아기 의자에 앉혀 몸을 똑바로 세운 자세로 먹인다.
      작은 숟가락을 아기 쪽으로 내밀고, 아기가 입을 벌리며 다가오면 혀 가운데에 올려 준다.
    min_month: 4
    max_month: 8
    tags: [weaning, spoon, how_to_feed]
    texture: puree
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Practical advice, How to start complementary feeding (p.33)

  - doc_key: food.weaning.stage.flavours
    row_type: weaning_stage
    title: 여러 가지 맛 보여 주기
    body: >-
      곱게 간 음식을 줄 때부터 단맛이 나는 것, 고소한 것, 쓴맛이 나는 채소까지 여러 맛을 골고루 맛보게
      한다.
    min_month: 4
    max_month: 8
    tags: [weaning, taste, variety]
    texture: puree
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, Starting out (p.28)

  - doc_key: food.weaning.stage.milk_order
    row_type: weaning_stage
    title: 젖 · 분유와 이유식 순서
    body: >-
      8~9개월 무렵까지는 젖이나 분유를 먼저 먹이고 이유식을 준다. 그 뒤로는 이유식을 먼저 주고 젖이나
      분유를 이어서 먹인다.
    min_month: 4
    max_month: 12
    tags: [weaning, milk_feed, order]
    allergen_codes: [2]  # 분유 → 우유
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Practical advice, How to start complementary feeding (p.33)

  - doc_key: food.weaning.stage.no_salt
    row_type: weaning_stage
    title: 이유식은 간하지 않는다
    body: >-
      이유식에는 소금 같은 간을 하지 않고 싱겁게 만든다. 시판 이유식을 고를 때도 원재료와 영양성분 표시를
      보고 싱거운 것을 고른다.
    min_month: 4
    max_month: 12
    tags: [weaning, seasoning, salt, store_bought]
    <<: [*kca, *draft]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 구입·주문할 때 (22쪽)

  - doc_key: food.weaning.stage.m6_7.texture
    row_type: weaning_stage
    title: 6~7개월 이유식 질감
    body: >-
      6개월 무렵부터는 곱게 간 음식을 점점 되직하게 만들고, 으깬 음식과 부드러운 음식도 준다. 부드러운
      음식은 엄지와 검지로 누르거나 혀로 입천장에 눌렀을 때 쉽게 뭉개지는 정도다.
    min_month: 6
    max_month: 8
    tags: [weaning, texture, mashed]
    texture: mashed
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, Starting out (p.28)

  - doc_key: food.weaning.stage.m6_7.move_on
    row_type: weaning_stage
    title: 곱게 간 단계에 오래 머물지 않는다
    body: >-
      곱게 간 음식은 시작 단계로만 쓰고, 몇 주에 걸쳐 으깬 음식과 덩어리가 있는 음식으로 넘어간다.
      깨물고 씹는 연습을 일찍 시작하게 하려는 것이다.
    min_month: 6
    max_month: 8
    tags: [weaning, texture, lumpy, chewing]
    texture: mashed
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Key points (p.22) · Reasons for the recommendations (p.23)

  - doc_key: food.weaning.stage.grasp
    row_type: weaning_stage
    title: 손에 쥐는 무른 음식
    body: >-
      7개월 무렵부터는 껍질과 씨를 뺀 무른 음식을 아기가 손에 쥘 만한 큰 조각으로 줘서 스스로 입에
      가져가 보게 한다.
    min_month: 7
    max_month: 12
    tags: [weaning, finger_food, self_feeding]
    texture: soft_pieces
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, Seven to nine months (p.28)

  - doc_key: food.weaning.stage.m8_11.texture
    row_type: weaning_stage
    title: 8~11개월 이유식 질감
    body: >-
      8개월 무렵부터는 다지거나 잘게 썬 음식을 더한다. 처음에는 으깬 음식에 섞어 주다가 차츰 따로 준다.
      손으로 집어 먹는 음식도 함께 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, texture, minced, finger_food]
    texture: minced
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, Seven to nine months (p.28)

  - doc_key: food.weaning.stage.m8_11.no_long_puree
    row_type: weaning_stage
    title: 곱게 간 음식만 오래 주지 않는다
    body: >-
      곱게 간 음식만 계속 주고 덩어리 있는 음식을 9개월 뒤까지 미루면, 자라서 먹는 데 어려움을 겪거나
      채소와 과일을 덜 먹는 것과 관련이 있다.
    min_month: 8
    max_month: 12
    tags: [weaning, texture, lumpy]
    texture: minced
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, Note (p.28)

  - doc_key: food.weaning.stage.meals
    row_type: weaning_stage
    title: 이유식 끼니 늘리기
    body: >-
      이유식 양은 조금씩 늘려 간다. 9개월 무렵부터는 아기 식욕에 맞춰 하루 두세 끼와 간식 한두 번으로
      차려 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, meals, snack, schedule]
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Practical advice, How to start complementary feeding (p.33)

  - doc_key: food.weaning.stage.m10_11.family_food
    row_type: weaning_stage
    title: 10~11개월, 가족 음식으로
    body: >-
      여러 맛과 질감을 계속 주면서 가족이 먹는 음식도 작게 잘라 함께 준다. 돌 무렵에는 가족과 같은
      종류의 음식을 먹도록 이끌고, 아기 음식을 따로 차릴 필요는 없다.
    min_month: 10
    max_month: 12
    tags: [weaning, family_food, texture]
    texture: soft_pieces
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Increasing food texture, 10–12 months (p.29)

  # ── weaning_ingredient — 식품군 단위 ──────────────────────────────────────
  - doc_key: food.weaning.ingredient.one_at_a_time
    row_type: weaning_ingredient
    title: 새 재료는 한 가지씩
    body: 이유식 초기에는 여러 재료를 한꺼번에 섞지 않고 한 가지 재료씩 더해 간다.
    min_month: 4
    max_month: 12
    tags: [weaning, new_food, one_at_a_time]
    <<: [*kca, *draft]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.weaning.ingredient.grains.start
    row_type: weaning_ingredient
    title: 곡류 — 곱게 쑨 곡물부터
    body: >-
      곡류는 철분을 더한 아기용 곡물 가루를 곱게 쑤어 시작할 수 있다. 농도는 젖이나 분유로 맞춘다.
    min_month: 4
    max_month: 8
    tags: [weaning, grains, cereal, iron]
    texture: puree
    food_groups: [grains]
    allergen_codes: [2]  # 분유 → 우유
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Iron-rich foods (p.24) · Table 2 Puréed food (p.26)

  - doc_key: food.weaning.ingredient.grains.porridge
    row_type: weaning_ingredient
    title: 곡류 — 되직한 죽
    body: 쌀이나 귀리 같은 곡물로 쑨 죽을 점점 되직하게 해서 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, grains, porridge]
    texture: mashed
    food_groups: [grains]
    <<: [*nz, *draft]
    source_locator: Table 2 Soft foods (p.26) · Eating Statement 3 grain foods (p.37)

  - doc_key: food.weaning.ingredient.grains.finger
    row_type: weaning_ingredient
    title: 곡류 — 손으로 집는 곡물 음식
    body: >-
      8개월 무렵부터는 푹 익힌 국수, 손가락 모양으로 자른 빵, 입에서 잘 녹는 쌀과자처럼 손으로 집어 먹는
      곡물 음식도 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, grains, finger_food, noodles, bread]
    texture: soft_pieces
    food_groups: [grains]
    allergen_codes: [6]  # 국수 · 빵 → 밀
    <<: [*nz, *draft]
    source_locator: Table 2 Finger foods (p.27)

  - doc_key: food.weaning.ingredient.vegetables.start
    row_type: weaning_ingredient
    title: 채소 — 익혀서 곱게
    body: >-
      감자, 단호박, 당근처럼 껍질을 벗겨 익힌 채소나 브로콜리, 콜리플라워, 시금치처럼 쪄서 곱게 간 채소로
      시작한다.
    min_month: 4
    max_month: 8
    tags: [weaning, vegetables, puree]
    texture: puree
    food_groups: [vegetables]
    <<: [*nz, *draft]
    source_locator: Table 2 Puréed food (p.26)

  - doc_key: food.weaning.ingredient.vegetables.bitter
    row_type: weaning_ingredient
    title: 채소 — 쓴맛 나는 채소도 여러 번
    body: >-
      쓴맛이 나는 채소는 처음에 싫어하는 듯해도 계속 내놓는다. 보고 만지고 맛보기를 여러 번 되풀이해야
      익숙해진다.
    min_month: 4
    max_month: 12
    tags: [weaning, vegetables, bitter, repeated_exposure]
    food_groups: [vegetables]
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Vegetables and fruits (p.25)

  - doc_key: food.weaning.ingredient.vegetables.soft
    row_type: weaning_ingredient
    title: 채소 — 무른 조각
    body: >-
      껍질을 벗기고 푹 익힌 호박, 감자, 당근, 애호박이나 찐 브로콜리 송이처럼 무른 채소를 조각으로 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, vegetables, soft_food, finger_food]
    texture: soft_pieces
    food_groups: [vegetables]
    <<: [*nz, *draft]
    source_locator: Table 2 Soft foods (p.26)

  - doc_key: food.weaning.ingredient.vegetables.chopped
    row_type: weaning_ingredient
    title: 채소 — 잘게 썬 채소
    body: >-
      익힌 채소는 잘게 썰어 주고, 오이나 토마토 같은 생채소는 아주 잘게 썰거나 강판에 갈아서 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, vegetables, chopped, raw_vegetables]
    texture: minced
    food_groups: [vegetables]
    allergen_codes: [12]  # 토마토
    <<: [*nz, *draft]
    source_locator: Table 2 Chopped · Finger foods (p.27)

  - doc_key: food.weaning.ingredient.vegetables.canned_frozen
    row_type: weaning_ingredient
    title: 냉동 · 통조림 채소와 과일
    body: >-
      냉동이나 통조림 채소와 과일도 쓸 수 있다. 통조림 채소는 소금을 넣지 않은 것을, 과일은 시럽이 아닌
      과즙에 담긴 것을 고르고 국물은 따라 낸다.
    min_month: 6
    max_month: 12
    tags: [weaning, vegetables, fruits, canned, frozen]
    food_groups: [vegetables, fruits]
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Vegetables and fruits (p.25)

  - doc_key: food.weaning.ingredient.fruits.start
    row_type: weaning_ingredient
    title: 과일 — 익혀서 곱게
    body: 사과와 배는 껍질과 씨를 빼고 익혀서 곱게 갈아 준다.
    min_month: 4
    max_month: 8
    tags: [weaning, fruits, puree]
    texture: puree
    food_groups: [fruits]
    <<: [*nz, *draft]
    source_locator: Table 2 Puréed food (p.26)

  - doc_key: food.weaning.ingredient.fruits.soft
    row_type: weaning_ingredient
    title: 과일 — 잘 익은 무른 과일
    body: >-
      바나나, 아보카도, 망고, 멜론, 잘 익은 배처럼 무른 과일은 껍질과 씨를 빼고 으깨거나 조각으로 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, fruits, soft_food, mashed]
    texture: mashed
    food_groups: [fruits]
    <<: [*nz, *draft]
    source_locator: Table 2 Soft foods · Mashed/lumpy food (p.26)

  - doc_key: food.weaning.ingredient.fruits.grated
    row_type: weaning_ingredient
    title: 과일 — 강판에 갈거나 잘라서
    body: 단단한 사과와 배는 껍질을 벗겨 강판에 갈아 주고, 베리류는 반으로 잘라 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, fruits, grated, finger_food]
    texture: minced
    food_groups: [fruits]
    <<: [*nz, *draft]
    source_locator: Table 2 Finger foods · Chopped (p.27)

  - doc_key: food.weaning.ingredient.protein.iron_first
    row_type: weaning_ingredient
    title: 고기 · 생선 — 철분 많은 음식을 첫 음식으로
    body: >-
      생후 6개월 무렵에는 엄마에게서 받은 철분이 줄어들기 시작하므로 철분이 많은 음식을 매일 준다. 익혀서
      곱게 갈거나 다진 고기, 닭고기, 생선이 좋은 첫 음식이다.
    min_month: 4
    max_month: 12
    tags: [weaning, iron, meat, chicken, fish, first_food]
    texture: puree
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [10, 15, 16]  # 고기(돼지 · 닭 · 쇠고기) · 닭고기
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Iron-rich foods (p.24)

  - doc_key: food.weaning.ingredient.protein.legumes
    row_type: weaning_ingredient
    title: 두부 · 콩 — 채소나 과일과 함께
    body: >-
      익혀서 으깬 두부, 콩, 렌틸콩은 비타민 C가 많은 채소나 과일과 함께 주면 그 속의 철분을 더 잘
      흡수한다.
    min_month: 6
    max_month: 12
    tags: [weaning, iron, tofu, legumes]
    texture: mashed
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [5]  # 두부 · 콩 → 대두
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Iron-rich foods (p.24) · Table 2 Mashed/lumpy food (p.26)

  - doc_key: food.weaning.ingredient.protein.egg_cooked
    row_type: weaning_ingredient
    title: 달걀 — 속까지 익혀서
    body: 달걀은 속까지 완전히 익혀서 으깨어 준다. 덜 익은 달걀은 식중독을 일으킬 수 있다.
    min_month: 6
    max_month: 12
    tags: [weaning, egg, food_safety]
    texture: mashed
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [1]
    <<: [*nz, *draft]
    source_locator: Table 2 Mashed/lumpy food (p.26)

  - doc_key: food.weaning.ingredient.protein.fish
    row_type: weaning_ingredient
    title: 생선 — 가시를 다 발라서
    body: >-
      생선은 익혀서 가시를 모두 발라낸 뒤 으깨어 주거나, 물에 쪄서 작게 부스러뜨려 손으로 집게 한다.
    min_month: 6
    max_month: 12
    tags: [weaning, fish, bones, finger_food]
    texture: mashed
    food_groups: [meat_fish_egg_legumes]
    <<: [*nz, *draft]
    source_locator: Table 2 Mashed/lumpy food (p.26) · Finger foods (p.27)

  - doc_key: food.weaning.ingredient.protein.minced
    row_type: weaning_ingredient
    title: 고기 — 다지거나 잘게 찢어서
    body: >-
      8개월 무렵부터는 익힌 고기와 닭고기를 다지거나 잘게 찢거나 곱게 썰어 준다. 오래 익혀 부드러워진
      고기도 좋다.
    min_month: 8
    max_month: 12
    tags: [weaning, meat, chicken, minced]
    texture: minced
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [10, 15, 16]
    <<: [*nz, *draft]
    source_locator: Table 2 Chopped (p.27)

  - doc_key: food.weaning.ingredient.protein.egg_finger
    row_type: weaning_ingredient
    title: 달걀 · 두부 — 손으로 집는 모양
    body: >-
      완숙 달걀을 쐐기 모양으로 자르거나 달걀말이를 막대 모양으로 썰고, 부드러운 두부는 조각으로 줘서
      손으로 집어 먹게 한다.
    min_month: 8
    max_month: 12
    tags: [weaning, egg, tofu, finger_food]
    texture: soft_pieces
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [1, 5]
    <<: [*nz, *draft]
    source_locator: Table 2 Finger foods (p.27)

  - doc_key: food.weaning.ingredient.dairy.yoghurt
    row_type: weaning_ingredient
    title: 요거트 — 지방을 빼지 않은 플레인
    body: 지방을 빼지 않고 설탕을 넣지 않은 플레인 요거트를 곁들여 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, dairy, yoghurt]
    texture: mashed
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*nz, *draft]
    source_locator: Table 2 Soft foods (p.26) · Eating Statement 4 Food ideas (p.52)

  - doc_key: food.weaning.ingredient.dairy.cheese
    row_type: weaning_ingredient
    title: 치즈 — 살균한 치즈를 갈거나 얇게
    body: >-
      코티지치즈는 으깬 음식처럼 주고, 살균한 일반 치즈는 강판에 갈거나 얇게 썰어 손으로 집게 한다.
    min_month: 6
    max_month: 12
    tags: [weaning, dairy, cheese, finger_food]
    texture: mashed
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*nz, *draft]
    source_locator: Table 2 Mashed/lumpy food (p.26) · Finger foods (p.27) · Eating Statement 4 Food ideas (p.52)

  # ── feeding_tip — 먹이는 태도 · 질식 예방 · 마실 것 ────────────────────────
  - doc_key: food.tip.hunger_cues
    row_type: feeding_tip
    title: 배고프다는 신호
    body: >-
      입을 벌리거나 음식 쪽으로 몸을 기울이고, 보채며 몸짓이 커지면 배가 고프다는 뜻이다. 말을 하는 아이는
      먹을 것을 달라고 하거나 손으로 가리킨다. 이런 신호가 보이면 늦지 않게 먹을 것을 준다.
    min_month: 4
    max_month: 24
    tags: [responsive_feeding, hunger_cues]
    <<: [*nz, *draft]
    source_locator: Eating Statement 6 — How to recognise when a baby or toddler is hungry or full (p.66)

  - doc_key: food.tip.fullness_cues
    row_type: feeding_tip
    title: 그만 먹겠다는 신호
    body: >-
      고개를 돌리거나 젓는 것, 입을 꼭 다무는 것, 음식이나 그릇을 밀어내는 것, 뱉어 내는 것, 주변에 더
      관심을 보이는 것은 배가 부르다는 뜻이다. 이런 신호가 보이면 더 먹이지 않고 끝낸다.
    min_month: 4
    max_month: 24
    tags: [responsive_feeding, fullness_cues]
    <<: [*nz, *draft]
    source_locator: Eating Statement 6 — Signs of fullness (p.67) · Eating Statement 2 Practical advice (p.33)

  - doc_key: food.tip.no_forcing
    row_type: feeding_tip
    title: 억지로 먹이지 않는다
    body: 아이가 먹는 양은 식욕에 따라 다르다. 한꺼번에 많이 먹이거나 억지로 먹이지 않는다.
    min_month: 4
    max_month: 12
    tags: [responsive_feeding, appetite]
    <<: [*kca, *draft]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.tip.same_place
    row_type: feeding_tip
    title: 늘 같은 자리에서 규칙적으로
    body: 이유식은 늘 같은 자리에서 비슷한 시간에 먹이고, 숟가락으로 떠먹인다.
    min_month: 4
    max_month: 12
    tags: [routine, mealtime, spoon]
    <<: [*kca, *draft]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.tip.leftovers
    row_type: feeding_tip
    title: 먹다 남긴 이유식
    body: >-
      아기가 먹다 남긴 이유식은 다음에 다시 주지 않는다. 시판 이유식은 한 번 먹을 만큼 덜어 주고, 남은
      것은 밀폐 용기에 옮겨 제품에 적힌 대로 냉장하거나 냉동한다.
    min_month: 4
    max_month: 12
    tags: [food_safety, leftovers, storage, store_bought]
    <<: [*kca, *draft]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 보관할 때 (22쪽)

  - doc_key: food.tip.pouch
    row_type: feeding_tip
    title: 파우치 이유식은 덜어서
    body: >-
      파우치에 든 이유식은 아기가 직접 빨아 먹게 하지 말고 그릇이나 숟가락에 덜어서 떠먹인다. 그래야
      음식을 보고 냄새 맡고 만져 볼 수 있다. 시판 이유식만 쓰면 맛과 질감이 단조로워질 수 있다.
    min_month: 4
    max_month: 12
    tags: [store_bought, pouch, spoon]
    <<: [*nz, *draft]
    source_locator: Eating Statement 4 — Commercial baby food (p.50)

  - doc_key: food.tip.new_food_faces
    row_type: feeding_tip
    title: 처음 맛볼 때 짓는 표정
    body: >-
      새 음식을 맛볼 때 얼굴을 찡그려도 싫다는 뜻이 아닐 수 있다. 새로운 맛과 질감을 알아 가는 중이니
      웃으며 반겨 주고 칭찬한다.
    min_month: 4
    max_month: 12
    tags: [new_food, encouragement]
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Practical advice (p.34)

  - doc_key: food.tip.repeated_exposure
    row_type: feeding_tip
    title: 싫어하는 듯한 음식도 다시 내놓기
    body: >-
      처음에 싫어하는 듯한 음식도 억지로 먹이지 말고 여러 날 꾸준히 내놓는다. 조리법이나 질감을 바꾸거나
      좋아하는 음식 옆에 곁들이면 받아들이기 쉽다.
    min_month: 6
    max_month: 24
    tags: [refusal, repeated_exposure, picky_eating]
    <<: [*nz, *draft]
    source_locator: Eating Statement 3 — The importance of repeated exposure to different foods (p.41)

  - doc_key: food.tip.family_meals
    row_type: feeding_tip
    title: 가족 식사에 함께 앉히기
    body: >-
      아기도 가족이 먹는 자리에 함께 앉힌다. 아이는 어른이 먹는 모습을 보고 따라 배우므로, 어른이 같은
      음식을 즐겁게 먹고 음식 이야기를 좋게 해 준다.
    min_month: 6
    max_month: 24
    tags: [family_meal, role_modeling, mealtime]
    <<: [*nz, *draft]
    source_locator: Eating Statement 2 — Practical advice (p.34) · Eating Statement 6 Enthusiastic role modelling (p.65)

  - doc_key: food.tip.no_screens
    row_type: feeding_tip
    title: 먹을 때는 화면을 끈다
    body: >-
      텔레비전, 태블릿, 휴대전화를 보면서 먹으면 배부른 신호를 알아차리기 어려워 더 먹기 쉽다. 식사
      시간에는 화면을 끄고 먹는 데 집중하게 한다.
    min_month: 6
    max_month: 24
    tags: [screens, mealtime, fullness_cues]
    <<: [*nz, *draft]
    source_locator: Eating Statement 6 — The pitfalls of eating in front of screens (p.68)

  - doc_key: food.tip.picky.offer_again
    row_type: feeding_tip
    title: 편식할 때 — 같은 음식을 여러 번
    body: >-
      가리는 음식이 있으면 같은 음식을 열 번 넘게 꾸준히 내놓는다. 조금씩 여러 가지를 담고, 다그치지
      않는다. 처음 먹어 보거나 싫다던 음식을 먹으면 칭찬하되 음식으로 상을 주지는 않는다.
    min_month: 12
    max_month: 24
    tags: [picky_eating, refusal, praise]
    <<: [*nz, *draft]
    source_locator: Eating Statement 6 — How to respond to a fussy eater (p.68)

  - doc_key: food.tip.picky.hungry_at_table
    row_type: feeding_tip
    title: 편식할 때 — 배고픈 채로 식탁에
    body: >-
      끼니 바로 전에는 간식을 주지 않아 배가 고픈 채로 식탁에 앉게 한다. 거부한 음식을 좋아하는 음식으로
      바꿔 주지 않고, 적당한 시간이 지나면 아무 말 없이 상을 치운다.
    min_month: 12
    max_month: 24
    tags: [picky_eating, refusal, snack, mealtime]
    <<: [*nz, *draft]
    source_locator: Eating Statement 6 — How to respond to a fussy eater (p.68)

  - doc_key: food.tip.choking.sit_and_watch
    row_type: feeding_tip
    title: 질식 예방 — 앉아서, 지켜보며
    body: >-
      먹거나 마실 때는 꼭 앉아 있게 하고 어른이 곁에서 지켜본다. 씹는 힘에 맞는 음식을 주고, 단단한 생사과나
      생당근은 강판에 갈거나 익히거나 잘게 썰어 준다.
    min_month: 6
    max_month: 24
    tags: [choking, safety, supervision]
    <<: [*nz, *draft]
    source_locator: Eating Statement 3 — How to reduce the risk of choking (p.43)

  - doc_key: food.tip.choking.round_foods
    row_type: feeding_tip
    title: 질식 예방 — 둥근 음식은 잘라서
    body: 포도는 세로로 4등분하고, 베리류는 반으로 자른다. 껍질이나 질긴 섬유, 씨는 미리 뺀다.
    min_month: 8
    max_month: 24
    tags: [choking, safety, round_food, grapes]
    food_groups: [fruits]
    <<: [*nz, *draft]
    source_locator: Table 2 Finger foods (p.27) · Eating Statement 3 How to reduce the risk of choking (p.43)

  - doc_key: food.tip.choking.gagging
    row_type: feeding_tip
    title: 헛구역질과 질식은 다르다
    body: >-
      헛구역질은 음식을 목 뒤에서 입 앞으로 밀어내는 반사라 대개 소리를 내거나 뱉어 낸다. 질식은 음식이
      숨길을 막아 숨쉬기 힘들고 소리를 거의 내지 못한다. 질식으로 보이면 바로 도와야 한다.
    min_month: 6
    max_month: 24
    tags: [choking, gagging, safety]
    <<: [*nz, *draft]
    source_locator: Eating Statement 3 — The difference between gagging and choking (p.42)

  - doc_key: food.tip.choking.stuffing
    row_type: feeding_tip
    title: 입에 잔뜩 넣는 시기
    body: >-
      두세 살 무렵에는 음식을 입에 잔뜩 밀어 넣기 쉬워 질식 위험이 커진다. 조각을 더 작게 하고 접시에
      한 번에 적게 담으며, 자리를 뜰 때 볼 안에 음식이 남아 있지 않은지 본다.
    min_month: 24
    max_month: 36
    tags: [choking, safety, portion]
    <<: [*nz, *draft]
    source_locator: Eating Statement 3 — How to reduce the risk of choking (p.43)

  - doc_key: food.tip.water_cup
    row_type: feeding_tip
    title: 이유식을 시작하면 물은 컵으로
    body: >-
      이유식을 시작한 뒤로는 끼니와 간식 때마다 맹물을 조금씩 준다. 뚜껑 없는 컵에 담아 아기가 두 손으로
      잡고 입에 가져가 보게 한다.
    min_month: 6
    max_month: 12
    tags: [drinks, water, cup]
    <<: [*nz, *draft]
    source_locator: Eating Statement 5 — Key points (p.55) · When to offer water (p.57)

  - doc_key: food.tip.drinks_after_one
    row_type: feeding_tip
    title: 돌이 지나면 마실 것
    body: >-
      돌이 지나면 젖과 함께 지방을 빼지 않은 살균 흰우유와 물을 마실 것으로 준다. 우유는 젖병이 아니라
      컵에 담아 준다.
    min_month: 12
    max_month: 24
    tags: [drinks, milk, water, cup]
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*nz, *draft]
    source_locator: Eating Statement 5 — Key points (p.55) · Cow's milk as a drink (p.58)

  - doc_key: food.tip.no_salt_sugar
    row_type: feeding_tip
    title: 돌이 지나도 간과 단맛은 더하지 않는다
    body: >-
      돌이 지난 아이의 음식에도 소금, 설탕, 시럽 같은 단맛을 더하지 않는다. 재료 본래의 맛에 익숙해져야
      짜고 단 맛에 길들지 않는다.
    min_month: 12
    max_month: 24
