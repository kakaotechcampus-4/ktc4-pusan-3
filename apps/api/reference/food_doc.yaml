rows:
  # ── weaning_stage — 시작 · 질감 · 먹이는 방법 ──────────────────────────────
  - doc_key: food.weaning.stage.start
    row_type: weaning_stage
    title: 이유식 시작 시기
    body: 이유식은 생후 4~6개월 사이에 시작한다.
    min_month: 4
    max_month: 7
    tags: [weaning, start, timing]
    texture: puree
    <<: [*kca, *temp_admin]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.weaning.stage.m4_5.texture
    row_type: weaning_stage
    title: 6개월 전에 시작할 때의 질감
    body: >-
      6개월이 되기 전에 이유식을 시작했다면 아주 묽게 간 음식부터 준다. 평소 먹던 것보다 조금 걸쭉한
      정도에서 출발해 삼키는 데 익숙해지게 한다.
    min_month: 4
    max_month: 6
    tags: [weaning, texture, puree, early_start]
    texture: puree
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, Starting out (p.28)

  - doc_key: food.weaning.stage.not_before_4
    row_type: weaning_stage
    title: 4개월 전에는 시작하지 않는다
    body: >-
      생후 4개월 전에 이유식을 시작하는 것은 이르다. 그 무렵에는 소화 기관과 콩팥이 평소 먹던 것 말고
      다른 음식을 받아들일 준비가 덜 되어 있다.
    min_month: 4
    max_month: 6
    tags: [weaning, start, timing, early_start]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Reasons for the recommendations (p.23)

  - doc_key: food.weaning.stage.first_spoon
    row_type: weaning_stage
    title: 처음 떠먹이는 방법
    body: >-
      아기가 편안하고 기분이 좋을 때 시작한다. 안거나 아기 의자에 앉혀 몸을 똑바로 세운 자세로 먹인다.
      작은 숟가락을 아기 쪽으로 내밀고, 아기가 입을 벌리며 다가오면 혀 가운데에 올려 준다.
    min_month: 4
    max_month: 8
    tags: [weaning, spoon, how_to_feed]
    texture: puree
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Practical advice, How to start complementary feeding (p.33)

  - doc_key: food.weaning.stage.flavours
    row_type: weaning_stage
    title: 여러 가지 맛 보여 주기
    body: >-
      곱게 간 음식을 줄 때부터 단맛이 나는 것, 고소한 것, 쓴맛이 나는 채소까지 여러 맛을 골고루 맛보게
      한다.
    min_month: 4
    max_month: 8
    tags: [weaning, taste, variety]
    texture: puree
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, Starting out (p.28)

  - doc_key: food.weaning.stage.milk_order
    row_type: weaning_stage
    title: 젖 · 분유와 이유식 순서
    body: >-
      8~9개월 무렵까지는 젖이나 분유를 먼저 먹이고 이유식을 준다. 그 뒤로는 이유식을 먼저 주고 젖이나
      분유를 이어서 먹인다.
    min_month: 4
    max_month: 12
    tags: [weaning, milk_feed, order]
    allergen_codes: [2]  # 분유 → 우유
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Practical advice, How to start complementary feeding (p.33)

  - doc_key: food.weaning.stage.no_salt
    row_type: weaning_stage
    title: 이유식은 간하지 않는다
    body: >-
      이유식에는 소금 같은 간을 하지 않고 싱겁게 만든다. 시판 이유식을 고를 때도 원재료와 영양성분 표시를
      보고 싱거운 것을 고른다.
    min_month: 4
    max_month: 12
    tags: [weaning, seasoning, salt, store_bought]
    <<: [*kca, *temp_admin]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 구입·주문할 때 (22쪽)

  - doc_key: food.weaning.stage.m6_7.texture
    row_type: weaning_stage
    title: 6~7개월 이유식 질감
    body: >-
      6개월 무렵부터는 곱게 간 음식을 점점 되직하게 만들고, 으깬 음식과 부드러운 음식도 준다. 부드러운
      음식은 엄지와 검지로 누르거나 혀로 입천장에 눌렀을 때 쉽게 뭉개지는 정도다.
    min_month: 6
    max_month: 8
    tags: [weaning, texture, mashed]
    texture: mashed
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, Starting out (p.28)

  - doc_key: food.weaning.stage.m6_7.move_on
    row_type: weaning_stage
    title: 곱게 간 단계에 오래 머물지 않는다
    body: >-
      곱게 간 음식은 시작 단계로만 쓰고, 몇 주에 걸쳐 으깬 음식과 덩어리가 있는 음식으로 넘어간다.
      깨물고 씹는 연습을 일찍 시작하게 하려는 것이다.
    min_month: 6
    max_month: 8
    tags: [weaning, texture, lumpy, chewing]
    texture: mashed
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Key points (p.22) · Reasons for the recommendations (p.23)

  - doc_key: food.weaning.stage.grasp
    row_type: weaning_stage
    title: 손에 쥐는 무른 음식
    body: >-
      7개월 무렵부터는 껍질과 씨를 뺀 무른 음식을 아기가 손에 쥘 만한 큰 조각으로 줘서 스스로 입에
      가져가 보게 한다.
    min_month: 7
    max_month: 12
    tags: [weaning, finger_food, self_feeding]
    texture: soft_pieces
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, Seven to nine months (p.28)

  - doc_key: food.weaning.stage.m8_11.texture
    row_type: weaning_stage
    title: 8~11개월 이유식 질감
    body: >-
      8개월 무렵부터는 다지거나 잘게 썬 음식을 더한다. 처음에는 으깬 음식에 섞어 주다가 차츰 따로 준다.
      손으로 집어 먹는 음식도 함께 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, texture, minced, finger_food]
    texture: minced
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, Seven to nine months (p.28)

  - doc_key: food.weaning.stage.m8_11.no_long_puree
    row_type: weaning_stage
    title: 곱게 간 음식만 오래 주지 않는다
    body: >-
      곱게 간 음식만 계속 주고 덩어리 있는 음식을 9개월 뒤까지 미루면, 자라서 먹는 데 어려움을 겪거나
      채소와 과일을 덜 먹는 것과 관련이 있다.
    min_month: 8
    max_month: 12
    tags: [weaning, texture, lumpy]
    texture: minced
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, Note (p.28)

  - doc_key: food.weaning.stage.meals
    row_type: weaning_stage
    title: 이유식 끼니 늘리기
    body: >-
      이유식 양은 조금씩 늘려 간다. 9개월 무렵부터는 아기 식욕에 맞춰 하루 두세 끼와 간식 한두 번으로
      차려 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, meals, snack, schedule]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Practical advice, How to start complementary feeding (p.33)

  - doc_key: food.weaning.stage.m10_11.family_food
    row_type: weaning_stage
    title: 10~11개월, 가족 음식으로
    body: >-
      여러 맛과 질감을 계속 주면서 가족이 먹는 음식도 작게 잘라 함께 준다. 돌 무렵에는 가족과 같은
      종류의 음식을 먹도록 이끌고, 아기 음식을 따로 차릴 필요는 없다.
    min_month: 10
    max_month: 12
    tags: [weaning, family_food, texture]
    texture: soft_pieces
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Increasing food texture, 10–12 months (p.29)

  # ── weaning_ingredient — 식품군 단위 ──────────────────────────────────────
  - doc_key: food.weaning.ingredient.one_at_a_time
    row_type: weaning_ingredient
    title: 새 재료는 한 가지씩
    body: 이유식 초기에는 여러 재료를 한꺼번에 섞지 않고 한 가지 재료씩 더해 간다.
    min_month: 4
    max_month: 12
    tags: [weaning, new_food, one_at_a_time]
    <<: [*kca, *temp_admin]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.weaning.ingredient.grains.start
    row_type: weaning_ingredient
    title: 곡류 — 곱게 쑨 곡물부터
    body: >-
      곡류는 철분을 더한 아기용 곡물 가루를 곱게 쑤어 시작할 수 있다. 농도는 젖이나 분유로 맞춘다.
    min_month: 4
    max_month: 8
    tags: [weaning, grains, cereal, iron]
    texture: puree
    food_groups: [grains]
    allergen_codes: [2]  # 분유 → 우유
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Iron-rich foods (p.24) · Table 2 Puréed food (p.26)

  - doc_key: food.weaning.ingredient.grains.porridge
    row_type: weaning_ingredient
    title: 곡류 — 되직한 죽
    body: 쌀이나 귀리 같은 곡물로 쑨 죽을 점점 되직하게 해서 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, grains, porridge]
    texture: mashed
    food_groups: [grains]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Soft foods (p.26) · Eating Statement 3 grain foods (p.37)

  - doc_key: food.weaning.ingredient.grains.finger
    row_type: weaning_ingredient
    title: 곡류 — 손으로 집는 곡물 음식
    body: >-
      8개월 무렵부터는 푹 익힌 국수, 손가락 모양으로 자른 빵, 입에서 잘 녹는 쌀과자처럼 손으로 집어 먹는
      곡물 음식도 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, grains, finger_food, noodles, bread]
    texture: soft_pieces
    food_groups: [grains]
    allergen_codes: [6]  # 국수 · 빵 → 밀
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Finger foods (p.27)

  - doc_key: food.weaning.ingredient.vegetables.start
    row_type: weaning_ingredient
    title: 채소 — 익혀서 곱게
    body: >-
      감자, 단호박, 당근처럼 껍질을 벗겨 익힌 채소나 브로콜리, 콜리플라워, 시금치처럼 쪄서 곱게 간 채소로
      시작한다.
    min_month: 4
    max_month: 8
    tags: [weaning, vegetables, puree]
    texture: puree
    food_groups: [vegetables]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Puréed food (p.26)

  - doc_key: food.weaning.ingredient.vegetables.bitter
    row_type: weaning_ingredient
    title: 채소 — 쓴맛 나는 채소도 여러 번
    body: >-
      쓴맛이 나는 채소는 처음에 싫어하는 듯해도 계속 내놓는다. 보고 만지고 맛보기를 여러 번 되풀이해야
      익숙해진다.
    min_month: 4
    max_month: 12
    tags: [weaning, vegetables, bitter, repeated_exposure]
    food_groups: [vegetables]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Vegetables and fruits (p.25)

  - doc_key: food.weaning.ingredient.vegetables.soft
    row_type: weaning_ingredient
    title: 채소 — 무른 조각
    body: >-
      껍질을 벗기고 푹 익힌 호박, 감자, 당근, 애호박이나 찐 브로콜리 송이처럼 무른 채소를 조각으로 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, vegetables, soft_food, finger_food]
    texture: soft_pieces
    food_groups: [vegetables]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Soft foods (p.26)

  - doc_key: food.weaning.ingredient.vegetables.chopped
    row_type: weaning_ingredient
    title: 채소 — 잘게 썬 채소
    body: >-
      익힌 채소는 잘게 썰어 주고, 오이나 토마토 같은 생채소는 아주 잘게 썰거나 강판에 갈아서 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, vegetables, chopped, raw_vegetables]
    texture: minced
    food_groups: [vegetables]
    allergen_codes: [12]  # 토마토
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Chopped · Finger foods (p.27)

  - doc_key: food.weaning.ingredient.vegetables.canned_frozen
    row_type: weaning_ingredient
    title: 냉동 · 통조림 채소와 과일
    body: >-
      냉동이나 통조림 채소와 과일도 쓸 수 있다. 통조림 채소는 소금을 넣지 않은 것을, 과일은 시럽이 아닌
      과즙에 담긴 것을 고르고 국물은 따라 낸다.
    min_month: 6
    max_month: 12
    tags: [weaning, vegetables, fruits, canned, frozen]
    food_groups: [vegetables, fruits]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Vegetables and fruits (p.25)

  - doc_key: food.weaning.ingredient.fruits.start
    row_type: weaning_ingredient
    title: 과일 — 익혀서 곱게
    body: 사과와 배는 껍질과 씨를 빼고 익혀서 곱게 갈아 준다.
    min_month: 4
    max_month: 8
    tags: [weaning, fruits, puree]
    texture: puree
    food_groups: [fruits]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Puréed food (p.26)

  - doc_key: food.weaning.ingredient.fruits.soft
    row_type: weaning_ingredient
    title: 과일 — 잘 익은 무른 과일
    body: >-
      바나나, 아보카도, 망고, 멜론, 잘 익은 배처럼 무른 과일은 껍질과 씨를 빼고 으깨거나 조각으로 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, fruits, soft_food, mashed]
    texture: mashed
    food_groups: [fruits]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Soft foods · Mashed/lumpy food (p.26)

  - doc_key: food.weaning.ingredient.fruits.grated
    row_type: weaning_ingredient
    title: 과일 — 강판에 갈거나 잘라서
    body: 단단한 사과와 배는 껍질을 벗겨 강판에 갈아 주고, 베리류는 반으로 잘라 준다.
    min_month: 8
    max_month: 12
    tags: [weaning, fruits, grated, finger_food]
    texture: minced
    food_groups: [fruits]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Finger foods · Chopped (p.27)

  - doc_key: food.weaning.ingredient.protein.iron_first
    row_type: weaning_ingredient
    title: 고기 · 생선 — 철분 많은 음식을 첫 음식으로
    body: >-
      생후 6개월 무렵에는 엄마에게서 받은 철분이 줄어들기 시작하므로 철분이 많은 음식을 매일 준다. 익혀서
      곱게 갈거나 다진 고기, 닭고기, 생선이 좋은 첫 음식이다.
    min_month: 4
    max_month: 12
    tags: [weaning, iron, meat, chicken, fish, first_food]
    texture: puree
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [10, 15, 16]  # 고기(돼지 · 닭 · 쇠고기) · 닭고기
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Iron-rich foods (p.24)

  - doc_key: food.weaning.ingredient.protein.legumes
    row_type: weaning_ingredient
    title: 두부 · 콩 — 채소나 과일과 함께
    body: >-
      익혀서 으깬 두부, 콩, 렌틸콩은 비타민 C가 많은 채소나 과일과 함께 주면 그 속의 철분을 더 잘
      흡수한다.
    min_month: 6
    max_month: 12
    tags: [weaning, iron, tofu, legumes]
    texture: mashed
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [5]  # 두부 · 콩 → 대두
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Iron-rich foods (p.24) · Table 2 Mashed/lumpy food (p.26)

  - doc_key: food.weaning.ingredient.protein.egg_cooked
    row_type: weaning_ingredient
    title: 달걀 — 속까지 익혀서
    body: 달걀은 속까지 완전히 익혀서 으깨어 준다. 덜 익은 달걀은 식중독을 일으킬 수 있다.
    min_month: 6
    max_month: 12
    tags: [weaning, egg, food_safety]
    texture: mashed
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [1]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Mashed/lumpy food (p.26)

  - doc_key: food.weaning.ingredient.protein.fish
    row_type: weaning_ingredient
    title: 생선 — 가시를 다 발라서
    body: >-
      생선은 익혀서 가시를 모두 발라낸 뒤 으깨어 주거나, 물에 쪄서 작게 부스러뜨려 손으로 집게 한다.
    min_month: 6
    max_month: 12
    tags: [weaning, fish, bones, finger_food]
    texture: mashed
    food_groups: [meat_fish_egg_legumes]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Mashed/lumpy food (p.26) · Finger foods (p.27)

  - doc_key: food.weaning.ingredient.protein.minced
    row_type: weaning_ingredient
    title: 고기 — 다지거나 잘게 찢어서
    body: >-
      8개월 무렵부터는 익힌 고기와 닭고기를 다지거나 잘게 찢거나 곱게 썰어 준다. 오래 익혀 부드러워진
      고기도 좋다.
    min_month: 8
    max_month: 12
    tags: [weaning, meat, chicken, minced]
    texture: minced
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [10, 15, 16]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Chopped (p.27)

  - doc_key: food.weaning.ingredient.protein.egg_finger
    row_type: weaning_ingredient
    title: 달걀 · 두부 — 손으로 집는 모양
    body: >-
      완숙 달걀을 쐐기 모양으로 자르거나 달걀말이를 막대 모양으로 썰고, 부드러운 두부는 조각으로 줘서
      손으로 집어 먹게 한다.
    min_month: 8
    max_month: 12
    tags: [weaning, egg, tofu, finger_food]
    texture: soft_pieces
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [1, 5]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Finger foods (p.27)

  - doc_key: food.weaning.ingredient.dairy.yoghurt
    row_type: weaning_ingredient
    title: 요거트 — 지방을 빼지 않은 플레인
    body: 지방을 빼지 않고 설탕을 넣지 않은 플레인 요거트를 곁들여 준다.
    min_month: 6
    max_month: 12
    tags: [weaning, dairy, yoghurt]
    texture: mashed
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Soft foods (p.26) · Eating Statement 4 Food ideas (p.52)

  - doc_key: food.weaning.ingredient.dairy.cheese
    row_type: weaning_ingredient
    title: 치즈 — 살균한 치즈를 갈거나 얇게
    body: >-
      코티지치즈는 으깬 음식처럼 주고, 살균한 일반 치즈는 강판에 갈거나 얇게 썰어 손으로 집게 한다.
    min_month: 6
    max_month: 12
    tags: [weaning, dairy, cheese, finger_food]
    texture: mashed
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Mashed/lumpy food (p.26) · Finger foods (p.27) · Eating Statement 4 Food ideas (p.52)

  # ── feeding_tip — 먹이는 태도 · 질식 예방 · 마실 것 ────────────────────────
  - doc_key: food.tip.hunger_cues
    row_type: feeding_tip
    title: 배고프다는 신호
    body: >-
      입을 벌리거나 음식 쪽으로 몸을 기울이고, 보채며 몸짓이 커지면 배가 고프다는 뜻이다. 말을 하는 아이는
      먹을 것을 달라고 하거나 손으로 가리킨다. 이런 신호가 보이면 늦지 않게 먹을 것을 준다.
    min_month: 4
    max_month: 24
    tags: [responsive_feeding, hunger_cues]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 6 — How to recognise when a baby or toddler is hungry or full (p.66)

  - doc_key: food.tip.fullness_cues
    row_type: feeding_tip
    title: 그만 먹겠다는 신호
    body: >-
      고개를 돌리거나 젓는 것, 입을 꼭 다무는 것, 음식이나 그릇을 밀어내는 것, 뱉어 내는 것, 주변에 더
      관심을 보이는 것은 배가 부르다는 뜻이다. 이런 신호가 보이면 더 먹이지 않고 끝낸다.
    min_month: 4
    max_month: 24
    tags: [responsive_feeding, fullness_cues]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 6 — Signs of fullness (p.67) · Eating Statement 2 Practical advice (p.33)

  - doc_key: food.tip.no_forcing
    row_type: feeding_tip
    title: 억지로 먹이지 않는다
    body: 아이가 먹는 양은 식욕에 따라 다르다. 한꺼번에 많이 먹이거나 억지로 먹이지 않는다.
    min_month: 4
    max_month: 12
    tags: [responsive_feeding, appetite]
    <<: [*kca, *temp_admin]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.tip.same_place
    row_type: feeding_tip
    title: 늘 같은 자리에서 규칙적으로
    body: 이유식은 늘 같은 자리에서 비슷한 시간에 먹이고, 숟가락으로 떠먹인다.
    min_month: 4
    max_month: 12
    tags: [routine, mealtime, spoon]
    <<: [*kca, *temp_admin]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 섭취할 때 (22쪽)

  - doc_key: food.tip.leftovers
    row_type: feeding_tip
    title: 먹다 남긴 이유식
    body: >-
      아기가 먹다 남긴 이유식은 다음에 다시 주지 않는다. 시판 이유식은 한 번 먹을 만큼 덜어 주고, 남은
      것은 밀폐 용기에 옮겨 제품에 적힌 대로 냉장하거나 냉동한다.
    min_month: 4
    max_month: 12
    tags: [food_safety, leftovers, storage, store_bought]
    <<: [*kca, *temp_admin]
    source_locator: 붙임 4 이유식 구매·섭취 가이드 — 보관할 때 (22쪽)

  - doc_key: food.tip.pouch
    row_type: feeding_tip
    title: 파우치 이유식은 덜어서
    body: >-
      파우치에 든 이유식은 아기가 직접 빨아 먹게 하지 말고 그릇이나 숟가락에 덜어서 떠먹인다. 그래야
      음식을 보고 냄새 맡고 만져 볼 수 있다. 시판 이유식만 쓰면 맛과 질감이 단조로워질 수 있다.
    min_month: 4
    max_month: 12
    tags: [store_bought, pouch, spoon]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 4 — Commercial baby food (p.50)

  - doc_key: food.tip.new_food_faces
    row_type: feeding_tip
    title: 처음 맛볼 때 짓는 표정
    body: >-
      새 음식을 맛볼 때 얼굴을 찡그려도 싫다는 뜻이 아닐 수 있다. 새로운 맛과 질감을 알아 가는 중이니
      웃으며 반겨 주고 칭찬한다.
    min_month: 4
    max_month: 12
    tags: [new_food, encouragement]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Practical advice (p.34)

  - doc_key: food.tip.repeated_exposure
    row_type: feeding_tip
    title: 싫어하는 듯한 음식도 다시 내놓기
    body: >-
      처음에 싫어하는 듯한 음식도 억지로 먹이지 말고 여러 날 꾸준히 내놓는다. 조리법이나 질감을 바꾸거나
      좋아하는 음식 옆에 곁들이면 받아들이기 쉽다.
    min_month: 6
    max_month: 24
    tags: [refusal, repeated_exposure, picky_eating]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 3 — The importance of repeated exposure to different foods (p.41)

  - doc_key: food.tip.family_meals
    row_type: feeding_tip
    title: 가족 식사에 함께 앉히기
    body: >-
      아기도 가족이 먹는 자리에 함께 앉힌다. 아이는 어른이 먹는 모습을 보고 따라 배우므로, 어른이 같은
      음식을 즐겁게 먹고 음식 이야기를 좋게 해 준다.
    min_month: 6
    max_month: 24
    tags: [family_meal, role_modeling, mealtime]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 2 — Practical advice (p.34) · Eating Statement 6 Enthusiastic role modelling (p.65)

  - doc_key: food.tip.no_screens
    row_type: feeding_tip
    title: 먹을 때는 화면을 끈다
    body: >-
      텔레비전, 태블릿, 휴대전화를 보면서 먹으면 배부른 신호를 알아차리기 어려워 더 먹기 쉽다. 식사
      시간에는 화면을 끄고 먹는 데 집중하게 한다.
    min_month: 6
    max_month: 24
    tags: [screens, mealtime, fullness_cues]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 6 — The pitfalls of eating in front of screens (p.68)

  - doc_key: food.tip.picky.offer_again
    row_type: feeding_tip
    title: 편식할 때 — 같은 음식을 여러 번
    body: >-
      가리는 음식이 있으면 같은 음식을 열 번 넘게 꾸준히 내놓는다. 조금씩 여러 가지를 담고, 다그치지
      않는다. 처음 먹어 보거나 싫다던 음식을 먹으면 칭찬하되 음식으로 상을 주지는 않는다.
    min_month: 12
    max_month: 24
    tags: [picky_eating, refusal, praise]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 6 — How to respond to a fussy eater (p.68)

  - doc_key: food.tip.picky.hungry_at_table
    row_type: feeding_tip
    title: 편식할 때 — 배고픈 채로 식탁에
    body: >-
      끼니 바로 전에는 간식을 주지 않아 배가 고픈 채로 식탁에 앉게 한다. 거부한 음식을 좋아하는 음식으로
      바꿔 주지 않고, 적당한 시간이 지나면 아무 말 없이 상을 치운다.
    min_month: 12
    max_month: 24
    tags: [picky_eating, refusal, snack, mealtime]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 6 — How to respond to a fussy eater (p.68)

  - doc_key: food.tip.choking.sit_and_watch
    row_type: feeding_tip
    title: 질식 예방 — 앉아서, 지켜보며
    body: >-
      먹거나 마실 때는 꼭 앉아 있게 하고 어른이 곁에서 지켜본다. 씹는 힘에 맞는 음식을 주고, 단단한 생사과나
      생당근은 강판에 갈거나 익히거나 잘게 썰어 준다.
    min_month: 6
    max_month: 24
    tags: [choking, safety, supervision]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 3 — How to reduce the risk of choking (p.43)

  - doc_key: food.tip.choking.round_foods
    row_type: feeding_tip
    title: 질식 예방 — 둥근 음식은 잘라서
    body: 포도는 세로로 4등분하고, 베리류는 반으로 자른다. 껍질이나 질긴 섬유, 씨는 미리 뺀다.
    min_month: 8
    max_month: 24
    tags: [choking, safety, round_food, grapes]
    food_groups: [fruits]
    <<: [*nz, *temp_admin]
    source_locator: Table 2 Finger foods (p.27) · Eating Statement 3 How to reduce the risk of choking (p.43)

  - doc_key: food.tip.choking.gagging
    row_type: feeding_tip
    title: 헛구역질과 질식은 다르다
    body: >-
      헛구역질은 음식을 목 뒤에서 입 앞으로 밀어내는 반사라 대개 소리를 내거나 뱉어 낸다. 질식은 음식이
      숨길을 막아 숨쉬기 힘들고 소리를 거의 내지 못한다. 질식으로 보이면 바로 도와야 한다.
    min_month: 6
    max_month: 24
    tags: [choking, gagging, safety]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 3 — The difference between gagging and choking (p.42)

  - doc_key: food.tip.choking.stuffing
    row_type: feeding_tip
    title: 입에 잔뜩 넣는 시기
    body: >-
      두세 살 무렵에는 음식을 입에 잔뜩 밀어 넣기 쉬워 질식 위험이 커진다. 조각을 더 작게 하고 접시에
      한 번에 적게 담으며, 자리를 뜰 때 볼 안에 음식이 남아 있지 않은지 본다.
    min_month: 24
    max_month: 36
    tags: [choking, safety, portion]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 3 — How to reduce the risk of choking (p.43)

  - doc_key: food.tip.water_cup
    row_type: feeding_tip
    title: 이유식을 시작하면 물은 컵으로
    body: >-
      이유식을 시작한 뒤로는 끼니와 간식 때마다 맹물을 조금씩 준다. 뚜껑 없는 컵에 담아 아기가 두 손으로
      잡고 입에 가져가 보게 한다.
    min_month: 6
    max_month: 12
    tags: [drinks, water, cup]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 5 — Key points (p.55) · When to offer water (p.57)

  - doc_key: food.tip.drinks_after_one
    row_type: feeding_tip
    title: 돌이 지나면 마실 것
    body: >-
      돌이 지나면 젖과 함께 지방을 빼지 않은 살균 흰우유와 물을 마실 것으로 준다. 우유는 젖병이 아니라
      컵에 담아 준다.
    min_month: 12
    max_month: 24
    tags: [drinks, milk, water, cup]
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 5 — Key points (p.55) · Cow's milk as a drink (p.58)

  - doc_key: food.tip.no_salt_sugar
    row_type: feeding_tip
    title: 돌이 지나도 간과 단맛은 더하지 않는다
    body: >-
      돌이 지난 아이의 음식에도 소금, 설탕, 시럽 같은 단맛을 더하지 않는다. 재료 본래의 맛에 익숙해져야
      짜고 단 맛에 길들지 않는다.
    min_month: 12
    max_month: 24
    tags: [seasoning, salt, sugar]
    <<: [*nz, *temp_admin]
    source_locator: Eating Statement 4 — Key points (p.48) · Reasons for the recommendations (p.49)

  # ── meal_pattern — 12–35개월 · 36–71개월 식사 구성 (#510) ──────────────────────

  - doc_key: food.meal_pattern.m12_35.day_rhythm
    row_type: meal_pattern
    title: 하루 식사 흐름
    body: >-
      하루를 아침 · 점심 · 저녁 세 끼로 잡고, 끼니 사이에 간식을 두세 번 넣어 규칙적으로 먹는 흐름을 만든다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, meals, rhythm, snack]
    <<: [*dfe, *draft]
    source_locator: "Menu planning — What to think about when planning menus, 1. Nutrition (p.19)"

  - doc_key: food.meal_pattern.m12_35.two_dishes
    row_type: meal_pattern
    title: 점심 · 저녁은 두 가지 음식으로
    body: >-
      점심과 저녁은 주된 요리 하나에 곁들임 하나를 더해 두 가지로 차린다. 곁들임은 수프, 채소 반찬, 과일이나 무가당 요거트 같은 두 번째 음식 가운데서 고른다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, meals, lunch, dinner, side_dish]
    food_groups: [vegetables, fruits, dairy]
    allergen_codes: [2]
    <<: [*dfe, *draft]
    source_locator: "Menu planning — What to think about when planning menus, 1. Nutrition (p.19)"

  - doc_key: food.meal_pattern.m12_35.family_meal
    row_type: meal_pattern
    title: 가족 음식을 작게 썰어 내기
    body: >-
      아이 몫을 따로 만들 필요 없이 가족이 먹는 음식을 아이 입에 맞게 작게 썰어 낸다. 소금이나 설탕을 더하지 않아 나트륨이 적은 음식으로 고른다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, meals, family_meal, texture]
    <<: [*nz, *draft]
    source_locator: "Eating Statement 2 — 10–12 months (p.29)"

  - doc_key: food.meal_pattern.m12_35.snack_basics
    row_type: meal_pattern
    title: 간식에 과일 · 채소와 곡류 넣기
    body: >-
      간식 가운데 일부에는 과일이나 채소를 넣고, 하루에 한 번 이상은 간을 하지 않은 곡류 간식을 둔다. 간 없는 크래커나 쌀과자가 그런 예다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, snack_pattern, snack, fruit, vegetable, grains]
    food_groups: [fruits, vegetables, grains]
    allergen_codes: [6]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Fruit and vegetables · Starchy carbohydrates (p.14)"

  - doc_key: food.meal_pattern.m12_35.snack_ideas
    row_type: meal_pattern
    title: 간식으로 낼 수 있는 음식
    body: >-
      부드럽게 익힌 당근, 바나나, 아보카도, 치즈, 으깬 달걀, 설탕을 넣지 않은 요거트를 간식으로 낼 수 있다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, snack_pattern, snack, snack_ideas]
    food_groups: [vegetables, fruits, dairy, meat_fish_egg_legumes]
    allergen_codes: [1, 2]
    <<: [*nz, *draft]
    source_locator: "Eating Statement 4 — Food ideas for babies and toddlers, Some healthy snacks (p.52)"

  - doc_key: food.meal_pattern.m12_35.four_groups
    row_type: meal_pattern
    title: 하루에 네 가지 식품군 고루
    body: >-
      하루 식사에는 채소 · 과일, 밥 · 빵 · 국수 같은 곡류, 우유 · 요거트 · 치즈 같은 유제품, 콩 · 생선 · 달걀 · 고기 같은 단백질 식품이 두루 들어가게 짠다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, groups, variety]
    food_groups: [vegetables, fruits, grains, dairy, meat_fish_egg_legumes]
    allergen_codes: [1, 2, 5, 6]
    <<: [*nz, *draft]
    source_locator: "Eating Statement 3 — introduction and Key points (p.37)"

  - doc_key: food.meal_pattern.m12_35.veg_fruit_each_meal
    row_type: meal_pattern
    title: 끼니마다 채소나 과일
    body: >-
      아침 · 점심 · 저녁 끼니마다 채소나 과일을 한 가지 이상 넣는다. 하루 안에서도, 한 주 동안에도 여러 가지 채소와 과일이 돌아가며 나오게 한다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, groups, vegetable, fruit]
    food_groups: [vegetables, fruits]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Fruit and vegetables (p.14)"

  - doc_key: food.meal_pattern.m12_35.starch_each_meal
    row_type: meal_pattern
    title: 끼니마다 곡류 한 가지
    body: >-
      아침 · 점심 · 저녁 끼니마다 밥, 빵, 국수, 감자 같은 곡류 음식을 한 가지씩 넣는다. 한 주 동안 곡류의 종류가 여러 가지로 돌아가게 한다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, groups, grains]
    food_groups: [grains]
    allergen_codes: [6]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Starchy carbohydrates (p.14)"

  - doc_key: food.meal_pattern.m12_35.protein_lunch_dinner
    row_type: meal_pattern
    title: 점심 · 저녁의 단백질 식품
    body: >-
      점심과 저녁에는 단백질 식품을 한 가지씩 넣고, 한 주 사이에 콩, 생선, 달걀, 고기가 번갈아 나오게 한다. 점심 한 번과 저녁 한 번은 콩류를 주된 단백질로 쓴다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, groups, protein]
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [1, 5]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Proteins (p.15)"

  - doc_key: food.meal_pattern.m12_35.dairy_three
    row_type: meal_pattern
    title: 우유 · 유제품은 하루 세 번
    body: >-
      우유와 무가당 유제품을 하루 세 번에 나눠 낸다. 요거트는 단맛을 더하지 않은 것을 고른다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, groups, dairy]
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Dairy and plain, fortified plant-based alternatives (p.15)"

  - doc_key: food.meal_pattern.m12_35.drinks
    row_type: meal_pattern
    title: 마실 것은 물과 우유
    body: >-
      마실 것은 물과 우유로 짠다. 물은 하루 내내 곁에 두고 끼니와 간식 때마다 권한다. 우유를 마시지 않으면 칼슘을 더한 무가당 식물성 음료로 바꾼다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, drink, water, milk]
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Drinks (p.16)"

  - doc_key: food.meal_pattern.m12_35.example_breakfast
    row_type: meal_pattern
    title: 아침 구성 예시
    body: >-
      아침은 곡류 음식에 과일을 곁들이고 달걀을 더하는 구성이 있다. 바나나와 딸기를 넣은 귀리죽, 달걀과 토스트 조각에 토마토를 곁들인 접시가 그런 예다. 딸기나 토마토처럼 작고 둥근
      것은 길게 네 갈래로 잘라서 낸다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, example, breakfast]
    food_groups: [grains, fruits, vegetables, meat_fish_egg_legumes]
    allergen_codes: [1, 6, 12]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Breakfast (p.24)"

  - doc_key: food.meal_pattern.m12_35.example_main
    row_type: meal_pattern
    title: 점심 · 저녁 주된 요리 구성 예시
    body: >-
      점심이나 저녁의 주된 요리는 곡류에 단백질 식품과 채소를 함께 얹는 틀이 기본이다. 병아리콩을 넣은 밥 요리, 렌틸콩과 브로콜리를 넣은 파스타, 닭고기와 채소를 싼 통밀 랩이 그런
      예다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, example, lunch, dinner, main_dish]
    food_groups: [grains, meat_fish_egg_legumes, vegetables]
    allergen_codes: [6, 15]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Lunch or tea · Main dish (p.25)"

  - doc_key: food.meal_pattern.m12_35.example_side
    row_type: meal_pattern
    title: 곁들임 구성 예시
    body: >-
      곁들임은 채소나 과일에 달걀이나 유제품을 짝지어 낸다. 채소 수프, 삶은 달걀과 익힌 당근, 무가당 요거트와 바나나, 치즈와 얇게 썬 딸기가 그런 예다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, example, side_dish]
    food_groups: [vegetables, fruits, dairy, meat_fish_egg_legumes]
    allergen_codes: [1, 2]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Lunch or tea · Starter, side dish or second dish (p.25)"

  - doc_key: food.meal_pattern.m12_35.example_snack
    row_type: meal_pattern
    title: 간식 구성 예시
    body: >-
      간식 하나에 곡류와 채소와 유제품이 함께 들어가는 조합도 있다. 치즈를 올린 머핀에 오이를 곁들이는 식이다.
    min_month: 12
    max_month: 36
    tags: [meal_pattern, example, snack]
    food_groups: [grains, vegetables, dairy]
    allergen_codes: [2, 6]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Snacks (p.25)"

  - doc_key: food.meal_pattern.m36_71.day_rhythm
    row_type: meal_pattern
    title: 세 끼와 간식, 점심 · 저녁은 두 가지
    body: >-
      세 살이 넘어서도 아침 · 점심 · 저녁 세 끼 사이에 간식을 두세 번 넣는 흐름을 이어 간다. 점심과 저녁은 주된 요리 하나에 곁들임 하나를 더해 두 가지로 차린다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, meals, rhythm, snack, side_dish]
    <<: [*dfe, *draft]
    source_locator: "Menu planning — What to think about when planning menus, 1. Nutrition (p.19)"

  - doc_key: food.meal_pattern.m36_71.eat_together
    row_type: meal_pattern
    title: 함께 앉아 같은 음식 먹기
    body: >-
      가족이 함께 앉아 같은 음식을 먹는다. 집에서는 손도 대지 않던 채소를 다른 사람이 먹는 모습을 보고 먹어 보는 일이 있다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, meals, eat_together]
    <<: [*dfe, *draft]
    source_locator: "Guidance for children aged 1 to 5 years — A healthy plate (p.13)"

  - doc_key: food.meal_pattern.m36_71.week_variety
    row_type: meal_pattern
    title: 한 주 단위로 돌려 가며 짜기
    body: >-
      식단을 한 주 단위로 훑어 보고, 맛 · 질감 · 색이 다른 음식이 고르게 돌아가게 한다. 같은 음식이 같은 요일마다 겹치지 않게 짠다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, meals, weekly_plan, variety]
    <<: [*dfe, *draft]
    source_locator: "Menu planning — 2. Varied and balanced diet across the week · 3. Plan menus lasting at least a week (p.19–20)"

  - doc_key: food.meal_pattern.m36_71.snack_basics
    row_type: meal_pattern
    title: 간식 구성의 기본
    body: >-
      간식 가운데 일부에는 과일이나 채소를 넣는다. 설탕과 소금을 넣지 않은 쌀과자나 옥수수과자, 간 없는 크래커 같은 곡류 간식은 하루 간식 중 한 번 이상 낸다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, snack_pattern, snack, fruit, vegetable, grains]
    food_groups: [fruits, vegetables, grains]
    allergen_codes: [6]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Fruit and vegetables · Starchy carbohydrates (p.14)"

  - doc_key: food.meal_pattern.m36_71.setting_home_timing
    row_type: meal_pattern
    title: 기관 식사와 집 식사 맞추기
    body: >-
      어린이집이나 유치원에서 끼니와 간식을 언제 먹었는지 알아 두고, 집에서 같은 끼니를 한 번 더 주지 않도록 간식과 저녁 시간을 맞춘다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, snack_pattern, snack, daycare, timing]
    <<: [*dfe, *draft]
    source_locator: "Menu planning — 6. Share menus with parents and/or carers (p.20)"

  - doc_key: food.meal_pattern.m36_71.four_groups
    row_type: meal_pattern
    title: 하루에 네 가지 식품군 고루
    body: >-
      채소 · 과일, 감자 · 빵 · 밥 · 국수 같은 곡류, 우유 · 요거트 · 치즈 같은 유제품, 콩 · 생선 · 달걀 · 고기 같은 단백질 식품을 날마다 끼니와 간식에 나눠
      담는다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, groups, variety]
    food_groups: [vegetables, fruits, grains, dairy, meat_fish_egg_legumes]
    allergen_codes: [1, 2, 5, 6]
    <<: [*dfe, *draft]
    source_locator: "Guidance for children aged 1 to 5 years — A healthy plate, The 4 food groups (p.13)"

  - doc_key: food.meal_pattern.m36_71.veg_fruit_variety
    row_type: meal_pattern
    title: 채소와 과일은 여러 가지로 돌려 내기
    body: >-
      채소와 과일은 하루 안에서도 한 주 안에서도 여러 가지가 돌아가게 낸다. 색이 다른 채소와 과일을 섞으면 종류를 바꾸기 쉽다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, groups, vegetable, fruit, variety]
    food_groups: [vegetables, fruits]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Fruit and vegetables (p.14) · Menu planning (p.19)"

  - doc_key: food.meal_pattern.m36_71.starch_variety
    row_type: meal_pattern
    title: 곡류는 종류를 돌려 가며
    body: >-
      곡류 음식은 한 주 동안 여러 종류로 돌려 낸다. 흰 곡류와 통곡류를 섞고, 아침 · 점심 · 저녁에 한 번씩은 통곡류를 쓴다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, groups, grains, wholegrain]
    food_groups: [grains]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Starchy carbohydrates (p.14)"

  - doc_key: food.meal_pattern.m36_71.protein_variety
    row_type: meal_pattern
    title: 단백질 식품은 돌려 가며
    body: >-
      점심과 저녁에는 단백질 식품을 한 가지씩 넣는다. 고기, 생선, 달걀, 콩류를 돌려 쓰고, 고기를 먹지 않는 집은 콩류와 대체 단백질 식품을 여러 가지로 쓴다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, groups, protein, variety]
    food_groups: [meat_fish_egg_legumes]
    allergen_codes: [1, 5]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Proteins (p.15)"

  - doc_key: food.meal_pattern.m36_71.dairy_three
    row_type: meal_pattern
    title: 우유 · 유제품은 하루 세 번
    body: >-
      우유와 무가당 유제품을 하루 세 번에 나눠 낸다. 치즈나 요거트도 유제품에 든다. 요거트는 단맛을 더하지 않은 것을 고른다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, groups, dairy]
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Dairy and plain, fortified plant-based alternatives (p.15)"

  - doc_key: food.meal_pattern.m36_71.drinks
    row_type: meal_pattern
    title: 마실 것은 물과 우유
    body: >-
      물은 하루 내내 마실 수 있게 곁에 두고, 우유나 칼슘을 더한 무가당 식물성 음료를 곁들인다. 마실 것은 이 둘로 짠다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, drink, water, milk]
    food_groups: [dairy]
    allergen_codes: [2]
    <<: [*dfe, *draft]
    source_locator: "Table 2 — Food and drink guidelines, Drinks (p.16)"

  - doc_key: food.meal_pattern.m36_71.example_breakfast
    row_type: meal_pattern
    title: 아침 구성 예시
    body: >-
      빵이나 토스트를 곡류로 하고 바나나나 달걀을 곁들인다. 계피를 뿌린 바나나 토스트, 달걀과 버섯을 구워 빵 조각과 함께 내는 접시가 그런 예다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, example, breakfast]
    food_groups: [grains, fruits, vegetables, meat_fish_egg_legumes]
    allergen_codes: [1, 6]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Breakfast (p.24)"

  - doc_key: food.meal_pattern.m36_71.example_main
    row_type: meal_pattern
    title: 점심 · 저녁 주된 요리 구성 예시
    body: >-
      점심이나 저녁의 주된 요리는 곡류에 단백질과 채소가 함께 오르도록 짠다. 가지와 토마토 카레에 차파티를 곁들이거나, 검은콩과 렌틸콩 완자에 쿠스쿠스를 곁들이거나, 여러 가지 콩을
      넣은 칠리에 나초를 곁들이는 식이다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, example, lunch, dinner, main_dish]
    food_groups: [grains, meat_fish_egg_legumes, vegetables]
    allergen_codes: [5, 6, 12]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Lunch or tea · Main dish (p.25)"

  - doc_key: food.meal_pattern.m36_71.example_side
    row_type: meal_pattern
    title: 곁들임 구성 예시
    body: >-
      곁들임으로는 채소 수프, 아보카도를 으깬 딥에 파프리카, 감자와 양배추를 볶은 요리, 무가당 쌀 푸딩에 반으로 자른 블루베리를 올린 것이 있다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, example, side_dish]
    food_groups: [vegetables, fruits, grains, dairy]
    allergen_codes: [1, 2]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Lunch or tea · Starter, side dish or second dish (p.25)"

  - doc_key: food.meal_pattern.m36_71.example_snack
    row_type: meal_pattern
    title: 간식 구성 예시
    body: >-
      참치 딥에 통밀 피타를 곁들이는 간식도 한 가지 구성이다. 곡류와 단백질 식품이 간식 하나에 함께 들어간다.
    min_month: 36
    max_month: 72
    tags: [meal_pattern, example, snack]
    food_groups: [grains, meat_fish_egg_legumes]
    allergen_codes: [6]
    <<: [*dfe, *draft]
    source_locator: "Table 4 — Example meals and snacks for children aged 1-5 years, Snacks (p.25)"

  # ── feeding_tip — 식사 태도 (#510). 공개 출처는 public_doc_source 가 가린다 ───────

  - doc_key: food.tip.eat_together_model
    row_type: feeding_tip
    title: 함께 먹는 모습 보여 주기
    body: >-
      아이는 어른이 먹는 모습을 따라 하며 새 음식을 익힌다. 가능한 한 자주 아이와 같은 자리에서 같은 음식을 함께 먹는다.
    min_month: 24
    max_month: 72
    tags: [feeding, modeling, fussy]
    <<: [*nhs_fussy, *draft]
    source_locator: "Fussy eaters — Tips for parents of fussy eaters, 2nd tip (2026-11-04 확인)"

  - doc_key: food.tip.small_portion_praise
    row_type: feeding_tip
    title: 적게 담고 먹은 것을 칭찬하기
    body: >-
      처음에는 적은 양을 담아 주고, 조금밖에 먹지 못해도 먹었다는 점을 칭찬한다.
    min_month: 24
    max_month: 72
    tags: [feeding, praise, portion, fussy]
    <<: [*nhs_fussy, *draft]
    source_locator: "Fussy eaters — Tips for parents of fussy eaters, 3rd tip (2026-11-04 확인)"

  - doc_key: food.tip.before_too_tired
    row_type: feeding_tip
    title: 지치기 전에 식사하기
    body: >-
      아이가 너무 배고프거나 피곤해질 때까지 식사를 미루지 않는다. 지치기 전에 식사 시간을 잡는다.
    min_month: 24
    max_month: 72
    tags: [feeding, timing, fussy]
    <<: [*nhs_fussy, *draft]
    source_locator: "Fussy eaters — Tips for parents of fussy eaters, 5th tip (2026-11-04 확인)"

  - doc_key: food.tip.slow_eater_wait
    row_type: feeding_tip
    title: 천천히 먹어도 기다리기
    body: >-
      먹는 데 시간이 오래 걸리는 아이도 있다. 재촉하지 않고 느긋하게 기다린다.
    min_month: 24
    max_month: 72
    tags: [feeding, patience, fussy]
    <<: [*nhs_fussy, *draft]
    source_locator: "Fussy eaters — Tips for parents of fussy eaters, 6th tip (2026-11-04 확인)"

  - doc_key: food.tip.no_food_reward
    row_type: feeding_tip
    title: 단 음식을 보상으로 쓰지 않기
    body: >-
      단 음식을 보상으로 주면 아이가 단 음식은 좋은 것, 채소는 싫은 것으로 여기기 쉽다. 보상은 공원에 가거나 함께 놀아 주는 약속으로 바꾼다.
    min_month: 24
    max_month: 72
    tags: [feeding, reward, sweets, fussy]
    <<: [*nhs_fussy, *draft]
    source_locator: "Fussy eaters — Tips for parents of fussy eaters, 8th tip (2026-11-04 확인)"

  - doc_key: food.tip.change_form
    row_type: feeding_tip
    title: 같은 재료의 조리 형태 바꿔 보기
    body: >-
      익힌 당근은 거부해도 날것을 갈아 낸 당근은 먹는 아이가 있다. 같은 재료를 날것, 익힌 것, 간 것으로 바꿔 내 본다.
    min_month: 24
    max_month: 72
    tags: [feeding, preparation, fussy]
    food_groups: [vegetables]
    <<: [*nhs_fussy, *draft]
    source_locator: "Fussy eaters — Tips for parents of fussy eaters, last tip (2026-11-04 확인)"

  - doc_key: food.tip.snack_ideas
    row_type: feeding_tip
    title: 간식 구성 예시
    body: >-
      간식으로는 얇게 썬 오이 같은 채소, 과일 한 조각, 무가당 요거트에 바나나를 썰어 넣은 것, 치즈 스프레드를 바른 토스트, 간 없는 크래커나 쌀과자에 치즈와 얇게 썬 채소를
      곁들인 것, 무가당 시리얼에 우유를 부은 것을 낼 수 있다.
    min_month: 24
    max_month: 72
    tags: [feeding, snack, snack_ideas]
    food_groups: [vegetables, fruits, dairy, grains]
    allergen_codes: [2, 6]
    <<: [*nhs_questions, *draft]
    source_locator: "Young children and food: common questions — What are healthy snacks for young children? (2026-11-04 확인)"

  - doc_key: food.tip.reduce_sweet_drinks
    row_type: feeding_tip
    title: 단 음료를 서서히 줄이기
    body: >-
      단 음료만 마시려는 아이는 습관을 바꾸는 데 시간이 걸린다. 음료에 물을 타서 물의 비율을 조금씩 늘리거나 당이 적은 제품으로 바꿔 차이가 크게 느껴지지 않게 한 뒤, 물이나
      우유로 옮겨 간다.
    min_month: 24
    max_month: 72
    tags: [feeding, drinks, sweet_drinks]
    allergen_codes: [2]
    <<: [*nhs_questions, *draft]
    source_locator: "Young children and food: common questions — My child will only drink sugary drinks. What can I do? (2026-11-04 확인)"
