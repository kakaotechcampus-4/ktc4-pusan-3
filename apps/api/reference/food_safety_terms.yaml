source: Food 안전 필터의 음식 어휘 — 표시기준 19종이 든 음식 · 19종 밖 알레르기 식품 · 묶음의 19종 밖 식품 · 연령 · 아이 금지 식품
version: "1"
fetched_at: 2026-10-07
# Food 만 읽는다. 알레르기 자체의 이름은 공용 allergen_terms.yaml 에 있다.
#
# 원칙
#   - 막는 쪽이 이긴다. 넣을지 애매하면 넣는다. guard 에는 그 성분이 확실히 없는 것만 넣는다.
#   - 요리 이름은 그 요리의 주재료가 늘 그 성분일 때만 넣는다(소면 · 우동 → 밀). 재료가 그때그때
#     다른 요리(떡볶이 · 김치 · 비빔밥)는 넣지 않는다 — 레시피 재료로 잡고, 재료를 모르면 unchecked 다.
#   - 시판 장류 · 가공식품은 그 성분이 거의 늘 들어가 표시 대상이 되면 넣는다(간장 · 된장 · 고추장 → 밀).
#   - 교차반응(오징어 ↔ 문어)은 코드로 넓히지 않는다. 코드는 표시기준의 그 항목만 뜻해야 추천의
#     allergens 가 거짓이 되지 않는다. 넓게 막을 때는 보호자가 묶음 이름(연체류)으로 등록한다.

# 19종 코드 → 그 성분이 든 음식. 메뉴명 · 재료를 훑어 코드를 붙인다. 보호자가 이 이름으로 등록해도 그 코드로 읽는다.
