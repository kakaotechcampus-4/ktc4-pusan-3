# 연령 · 아이 금지 식품. below_month 보다 어린 아이에게 적용한다(null 이면 모든 아이).
#   block   — 막는다. 추천에서 빠지고 급식 표시에는 경고가 붙는다.
#   caution — 막지 않고 주의만 단다(guide.choking_caution 같은 안내를 붙이라는 뜻).
#   scope   — all 이면 메뉴명 · 재료 전부, name 이면 메뉴명만 본다(마시는 것을 막는 규칙).
#   exact   — 메뉴명이 이 글자 그대로일 때만 건다(부분 일치가 아니다).
#   ends    — 메뉴명이 이 글자로 끝날 때 건다("검은콩 우유" 는 마시는 우유, "우유푸딩" 은 아니다).
#   exact · ends 는 메뉴명에서 급식표 알레르기 번호 · 괄호 · 양을 뗀 뒤 견준다.
age_rules:
  - label: 꿀
    below_month: 12
    action: block
    scope: all
    aliases: [꿀, 벌꿀, 허니, honey]
    guards: []
    exact: []
    source: 영아 보툴리누스증 — 1세 미만에게 꿀을 먹이지 않는다(질병관리청 · AAP)
  - label: 생우유
    below_month: 12
    action: block
    scope: all
    aliases: [생우유, 흰우유, 멸균우유, 저지방우유, 무지방우유, 유기농우유, 가공유, 딸기우유, 바나나우유, 초코우유, 커피우유, 따뜻한 우유, 데운 우유]
    guards: []
    exact: [우유]
    ends: [우유]
    source: 마시는 우유는 돌 이후에 준다 — 요리에 든 우유는 이 규칙이 아니다(대한소아청소년과학회 · AAP)
  - label: 질식 위험 식품
    below_month: 48
    action: block
    scope: all
    aliases: [팝콘, 사탕, 캔디, 껌, 젤리, 구미, gummy, 마시멜로, 마시멜로우, 머시멜로]
    guards: [솜사탕, 사탕수수, 로열젤리]
    exact: []
