# 19종 밖 알레르기. 보호자가 aliases 중 하나로 등록하면 aliases 전부를 글자로 막는다.
# 한국어 이름 하나뿐인 식품은 등록한 글자 그대로 막히지만, 검사지에서 옮긴 영어 이름(Almond · Codfish)은
# 그 글자로는 한국어 메뉴에 안 걸린다. 다른 이름 · 영어 이름 · 그 식품이 든 음식이 있으면 둔다.
# 사전에 없는 영어 이름은 글자 그대로만 막는다 — 한국어 메뉴에는 걸리지 않는다(문서 §3 의 한계).
