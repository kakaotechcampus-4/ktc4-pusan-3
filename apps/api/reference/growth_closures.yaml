    aliases: [깜빡임, 깜빡거, 깜빡여, 눈깜빡]
    guards: []
  - label: 킁킁거림
    aliases: [킁킁]
    guards: []
  - label: 헛기침
    aliases: [헛기침]
    guards: []
  - label: 고개 젖히기
    aliases: [고개젖, 고개를젖]
    guards: []
  - label: 머리 박기
    aliases: [머리박, 머리를박, 머리찧, 머리를찧]
    guards: []
  - label: 머리카락 뽑기
    aliases: [머리카락뽑, 머리카락을뽑, 머리뽑, 머리를뽑]
