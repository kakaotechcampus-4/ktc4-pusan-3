# 유아 1인분 보정 계수 — 성인 1인분(영양DB serving_g 가 성인 기준)에 곱해 유아가 그만큼
# 먹는다고 볼 때의 비율. 섭취기준의 "기준 체위"(연령군 체중 ÷ 성인 체중)로 산출한다
# (정하는 것 ④, docs/agents/food/영양소_계산_설계.md §4 N-3).
#
# 🚨 이 계수는 구간 판정에만 쓰고 절대량(실제 g)으로 화면·추천에 내보내지 않는다.
#
# 쓴 체위 값 — 보건복지부 「2025 한국인 영양소 섭취기준」(2025-12-31 발간, 발간등록번호
# 11-1352000-100416-13) 표 3 "2025 체위기준"(총론). 숫자는 사실이라 상수로 쓴다 — 원문
# 문장·표를 옮기지 않는다(food_sources.yaml kdri_2025 항목과 같은 입장).
#   1-2세 체중 11.7kg · 3-5세 체중 17.6kg
#   성인 체중 — 19-29세 기준체위는 성별로 나뉜다(남 69.1kg · 여 55.9kg). 이 프로젝트는 성별을
#   쓰지 않으므로(영양소_계산_설계 §1 전제 6), 두 값의 단순 평균 62.5kg 을 성인 1인분의 기준으로
#   쓴다. 어느 한쪽 성별의 1인분을 기준으로 삼을 근거가 없다.
#
# 계산식 — scale = 연령군 체중 ÷ 성인 체중(62.5kg)
#   1-2세: 11.7 / 62.5 = 0.1872
#   3-5세: 17.6 / 62.5 = 0.2816
#
# 잠정 — 실제 섭취량은 체중 비율보다 완만하게 늘어난다는 연구도 있어(대사체중 등 비선형 모델),
# 운영 데이터가 쌓이면 다시 본다(계획 "자체 점검 결과").

