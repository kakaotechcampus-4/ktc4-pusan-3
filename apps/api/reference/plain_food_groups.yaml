# 단일 식품 이름 → 식품군 표 — 보호자 말 · 급식표에 흔한 이름이 영양DB 이름과 안 맞아 식품군을 모를 때 쓴다
# 설계: app/agents/food/food_groups.py (appearance_food_groups) · 같은 폴더 food_groups.yaml 의 짝
#
# 🚨 식품군 **출현**에만 쓴다. 영양 합계 · 알레르기 판정 · 메뉴 카탈로그 행에는 쓰지 않는다.
#    카탈로그 행에 식품군이 있으면 그쪽이 먼저다 — 이 표는 그 행의 식품군이 비었을 때만 본다.
# 🚨 메뉴에 나오는 식품군을 **다** 적을 수 있는 단일 식품만 둔다. 섞인 음식(김밥 · 볶음밥 · 불고기 · 국 · 죽)과
#    쓰임이 갈리는 이름(버섯 · 해조류 · 잡곡밥 · 떡 · 빵 · 시리얼 · 토마토 · 순두부)은 넣지 않는다 —
#    일부만 적으면 그 메뉴가 "식품군을 아는 메뉴" 로 세여 출현 문장이 나가고, 빠진 식품군이 "0일" 이 된다.
# 🚨 조리에 쓴 기름 · 설탕은 적지 않는다. 출현 문장이 유지 · 당류를 말하지 않으므로 groups 는
#    grains · meat_fish_egg_legumes · vegetables · fruits · dairy 다섯 중에서만 고른다(fats_sugars 는 읽을 때 실패).
# 🚨 쌀밥 · 시금치나물처럼 영양DB 행이 이미 식품군을 아는 이름은 넣지 않는다. 중복을 만들면 표가 둘이 된다.
#
# 이름은 보호자 말 글자다(영양DB 글자가 아니다 — food_groups.yaml 과 다르다).
# 띄어쓰기 · 문장부호는 보지 않는다(normalize_menu_key). 같은 이름이 두 번 있으면 읽을 때 실패한다.
#   groups    식품군 이름. food_doc.yaml 이 쓰는 이름과 같다

source: "보호자 말 · 급식표에 흔한 단일 식품 이름 → 식품군 (사람이 검수)"
