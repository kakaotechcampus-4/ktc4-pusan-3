# growth_doc 시드 — 프롬프트 [예시] 에 들어가는 교육 활동 · 루틴 단계 행 (own_table §1 · RAG_plan Growth 절)
#
# P0 행(learning_activity · routine_step)을 채우는 판이다 (#293). 전부 status: draft — 검수 전에는
# 서비스가 읽지 않는다. rows 가 비어 있어도 읽힌다 (InMemoryGrowthDocs.from_seed() 는 빈 문서를 낸다, doc.no_row).
#
# 출처의 법적 근거는 고시 자체다 — 고시는 저작권법 제7조 2호의 보호받지 못하는 저작물이라 public_law 로 적는다.
# 아래 PDF 는 고시문을 읽은 사본이다. 교육부가 배포한 PDF 표지에 공공누리 제4유형 마크가 있어서, 행의
# 출처는 PDF 가 아니라 고시 번호로 적었고 검수 때 대조할 정본은 국가법령정보센터 행정규칙 본문이다
# (#337 과 같은 기준 — 상업적 이용과 변경이 둘 다 허락된 것만 행 출처로 쓴다).
#
# 원문 사본 — 저장소 밖(팀 드라이브)에 둔다. 파일이 같은지는 sha256 으로 본다.
#   표준보육과정 고시 (교육부고시 제2024-23호, 2024-12-09 고시 · 2025-03-01 시행) — 모든 행의 source_title
#     표준보육과정(0~2세)_고시문_최종(웹용)_0416.pdf
#     sha256 1be3352aae607d03d84d8ef652d74170d8f419ecb0d83f983c58ea84bb96364b
#     0~1세 영역별 내용 인쇄 9–14쪽 · 2세 15–20쪽 · 3~5세 21–26쪽 (PDF 10–14 · 16–20 · 22–26쪽).
#     총론 · 쪽 머리는 이미지라 텍스트가 안 나온다
#   2019 개정 누리과정 (교육부 고시 제2019-189호 · 보건복지부 고시 제2019-152호) — 해설서 부록 1 고시문만
#     (2019_개정_누리과정)_해설서.pdf
#     sha256 2e4e4f33f8a6486f9fc3878c735298c08da51bed5e07228f86cace6a18b1656a
#     부록 1 고시문 PDF 113–124쪽(인쇄 116–127쪽). 36–71개월 행을 처음 쓸 때 읽은 사본이다.
#     해설서 본문 · 신구 대조표는 쓰지 않았다
#   두 고시의 3~5세 영역별 내용은 같은 59개 내용이라 36–71개월 행도 위 고시의 3~5세(누리과정) 부분으로 적는다.
#   같은 고시는 같은 문자열이어야 D10(activity-agent-v1 §3)의 `DELETE WHERE source_title = ?` 한 줄로 뺄 수
#   있어서, activity_doc 과 같은 국가법령정보센터 이름을 쓴다 (#339 리뷰).
#
# 쓰지 않은 자료 — 공공누리 제4유형(출처표시 · 상업적 이용금지 · 변경금지)이거나 무단 복제 금지인 자료는
# 행의 근거로 쓰지 않는다 (상업 서비스 기준 #337, RAG_plan §4 · activity-agent-v1 §3).
#   2024 개정 표준보육과정(0~2세) 해설서 · 2019 개정 누리과정 해설서 본문 · 신구 대조표
#   양육 첫걸음 · 디지털 생활 부모 지원 자료 · 따뜻한 말 한마디 교재 · 사례집 · 놀이자료
#   위 PDF 들의 표지에 공공누리 마크가 있다. 이 시드가 읽은 것은 고시 본문(`public_law`)뿐이고,
#   해설서의 풀이 · 사례 · 사진 · 구성은 보지 않았다.
#
# routine_step 의 근거 — 고시에는 도움 수준별 단계가 없다. 같은 주제의 문구가 연령마다 "도움을 받아 한다 →
# 해 본다 → 한다" 로 바뀌는 곳은 단계마다 맞는 연령 문구를 source_locator 에 적었다. 연령 문구를 도움 수준에
# 대응시킨 것은 이 시드의 해석이라 검수자가 확인한다. 근거가 없거나 약한 사슬은 routine_step 절의 TODO 에 있다.
#
# 🚨 사실만 읽고 문장은 새로 쓴다. 원문 문장을 옮기지 않는다 (RAG_plan §0, 8어절 이상 일치 금지).
# 🚨 발달 이정표 · "이 나이면 ~할 수 있다" 문장 · 또래 비교를 쓰지 않는다 (own_table §1).
# 🚨 materials · body 에 음식 재료를 쓰지 않는다 — 음식이 들어가는 놀이는 Activity 몫이다.
#
# 행 칸 — 공통 칸은 RAG_plan §1, Growth 칸은 own_table §1.
#   row_type          learning_activity · routine_step · habit_strategy · manner_practice ·
#                     rhythm_info · book_guide · measure_guide
#   area              physical_health · communication · social · art · nature (basic_life 는 제4차 표준보육과정
#                     0~2세 영역이라 값으로만 남아 있다 — 2024 개정 고시는 0~5세 모두 5영역)
#   routine_category  self_care · mealtime · household_task · social_manner · habit · transition
#   trigger_tags      habit_strategy 가 읽는 상황 (bored · anxious · tired …). 영문 소문자
#   setting           indoor · outdoor · either
#   next_step_of      앞 단계 행의 doc_key. routine_step 끼리만 잇는다
#
# routine_step 규칙 (growth/tools/routine.py 의 pick_next_step 이 읽는다)
# - tags 에 assistance:<independent|verbal_prompt|partial_assist|full_assist> 를 정확히 하나 적는다.
#   그 행이 어느 도움 수준에 해당하는지다
# - doc_key 는 growth.routine.<routine_category>.<사슬 이름>.step<N> 이다 (예: growth.routine.self_care.toothbrush.step2).
#   같은 사슬 이름의 행이 한 사슬이고, run 은 이 이름으로 사슬을 통째로 읽는다. next_step_of 는 같은 사슬 안만 가리킨다
# - 한 사슬은 처음이 하나, 갈라지거나 끊기거나 돌지 않는다. 도움이 많이 필요한 수준에서 혼자 하는
#   수준 순서로 나아간다. 검수도 사슬 단위로 한다 — 가운데 행만 draft 면 run 이 읽는 사슬이 끊긴다
#
# 월령 — min_month 이상 max_month 미만. 12–35개월 학습 활동은 고시의 0~1세 · 2세, 36개월 이상은
#   3~5세(누리과정) 내용에서 쓴 행이라 두 구간에 걸치지 않는다. habit_strategy 는 min_month 가 36 이상이다(DB CHECK).
#
# 검수 — 작성자와 다른 사람이 원문을 펴 놓고 사실 · 월령 · 출처 위치를 확인한 뒤
# status: approved 와 reviewed_by · reviewed_at 을 채운다. 서비스는 approved 만 쓴다.
# 작성자 · 검수자는 GitHub 아이디로 적는다.
#
# 행마다 테스트가 보는 것 (tests/unit/agents/growth/test_growth_doc_seed.py)
# - 평가 표현 없음 · 위험 용어(행의 min_month 기준) 없음 · 음식 용어 없음 · 이정표 문장 없음
# - row_type 별 칸 (학습 활동은 area, 예절은 social_manner 24개월+, 습관은 habit + trigger_tags …)
# - routine_step 사슬이 pick_next_step 으로 읽힘

