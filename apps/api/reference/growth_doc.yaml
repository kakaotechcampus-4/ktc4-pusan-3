    row_type: learning_activity
    title: "질감이 다른 천 만져 보기"
    body: >-
      손수건, 수건, 담요처럼 느낌이 다른 천을 바닥에 펼쳐 놓고 아이가 만지고 문질러 보게 한다. 어른은 천마다 "보들보들", "까칠까칠" 하고
      느낌을 말로 붙여 준다. 천이 얼굴을 덮지 않게 곁에서 지켜본다.
