# Growth 문장 가드 목록 — reference/growth_guard.yaml
# 설계: docs/agents/growth/Growth_Tool_명세.md §2 "안전 필터"
#
# 모델이 쓴 교육 · 루틴 후보의 문장(제목 · 단계 · 이유 · 근거 메모)과 도서 추천의 이유 · 메모에서
# 아래 말이 나오면 그 후보를 고치지 않고 뺀다. 뺀 후보는 재호출 제외 목록으로 간다.
# 일반 추천의 이유는 코드 문구로 덮여 화면에 안 나가므로 최종 추천의 글을 본다.
#   diagnosis  진단명 · 병명 · 치료 — Growth 는 진단하지 않는다 (루트 §2)
#   coercion   체벌 · 가두기 · 굶기기 · 겁주기 같은 강압
#   commerce   구매 · 결제 · 구독 · 앱 설치 같은 상품 유도 (루트 §1 "상품 추천 안 함")
# 🚨 목록은 사람이 정한다 (growth_closures.yaml 과 같은 원칙). 모델이 고르지 않는다.
# 🚨 한 글자 별칭은 guards 가 있을 때만 쓴다. 로더가 guards 없는 한 글자 별칭을 거절한다.
#    guard 는 그 자리를 덮어 취소한다 — "식중독" 의 "중독" 은 걸리지 않는다.
# 🚨 guard 는 띄어쓰기를 넘지 않는다(match_fields). 부정형("혼내지 말고")도 걸린다 — 좋은 후보가
#    빠지는 쪽이라 받아들이고, 목록을 늘리기 전에 지어낸 문장으로 오탐을 잰다.
# 🚨 역할놀이(가게 놀이 · 병원 놀이 · 약국 놀이)와 낱말 속 글자(열매를 · 소매를 · 틱택토)가 걸리면
#    안 된다 — 3~5세 활동에 흔하다. 그래서 치료 · 처방 · 결제 · 구매는 낱말 그대로가 아니라 지시하는
#    꼴("치료 효과" · "결제해 보세요")로 적었고, 매를 · 틱은 guard 로 덮었다.
# 오탐 · 놓침은 tests/unit/agents/growth/test_growth_guard.py 의 지어낸 문장으로 잰다:
#    막아야 하는 35개 전부 걸리고, 비슷하지만 좋은 41개와 시드 문서 행 전부는 걸리지 않는다.
#    처음 목록이 시드 행 3개(세기의 "묶어" · "인사 주고받기" · 아이 행동을 적은 "소리를 지르거나")를
#    잘못 막아서 좁혔고, 리뷰에서 나온 역할놀이 · 열매를 · 틱택토 · 장애인을 같은 방식으로 좁혔다.

source: Growth Owner 초안 — Growth 는 진단 · 평가 · 상품 추천을 하지 않는다(루트 CLAUDE.md §1 · §2). 표준보육과정 3~5세 안전하게 생활하기와 같은 결에서 강압 · 진단 · 구매 유도를 막는다
version: "2026.1"
fetched_at: 2026-11-03

diagnosis:
