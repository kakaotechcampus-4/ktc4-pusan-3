# 묶음 이름 → 19종 코드 여럿. 보호자가 등록한 이름을 읽을 때만 쓴다 — 메뉴를 훑는 별칭이 아니다.
#   - includes 는 다른 묶음을 통째로 포함한다(해산물 = 생선 + 갑각류 + 연체류).
#   - 묶음 이름이 위 terms 의 별칭과 같으면(콩 · 글루텐) 그 별칭의 코드를 codes 에 꼭 넣는다 — 묶음이 더 넓어야 한다.
#   - guards 는 이름 안에서 묶음 이름을 찾을 때 덮는 것이다("coconut" 은 견과류가 아니다).
#   - 19종 밖 식품(가재 · 아몬드 · 연어 …)은 Food 전용 food_safety_terms.yaml 의 group_foods 에 둔다.
#   - 새 묶음 · 묶음 구성은 source 에 이렇게 묶은 근거를 적는다. 의료 검수를 직접 하기 어려워
#     근거로 대신한다 (#264 PM 리뷰). 넣을지 애매하면 넣는다.
groups:
  - label: 갑각류
    aliases: [갑각류, crustacean, crustaceans]
    codes: [8, 9]
    includes: []
    guards: []
    source: 표시기준 19종 중 갑각류는 게 · 새우다. 19종 밖 갑각류(가재 · 랍스터 · 크릴)는 food_safety_terms.yaml group_foods 에 둔다 (#258)
  - label: 연체류
    aliases: [연체류, 두족류, mollusk, mollusc]
    codes: [17, 18]
    includes: []
    guards: []
    source: 표시기준 19종 중 연체동물은 오징어 · 조개류다. "두족류" 로 등록해도 조개류까지 넓게 막는다 — 애매하면 막는다. 문어 · 낙지 · 주꾸미는 group_foods 에 둔다 (#258)
  - label: 생선
    aliases: [생선, 어류, 물고기, 생선류, fish]
    codes: [7]
    includes: []
    guards: []
