  - label: 견과류
    aliases: [견과류, 견과, 너트류, tree nut, nut, nuts]
    codes: [4, 14, 19]
    includes: []
    guards: [coconut, nutmeg, donut, doughnut, butternut]
    source: "19종 중 호두 · 잣과 땅콩을 넣는다. 땅콩은 콩과 식물이지만 견과류로 부르는 일이 많아 넣는다 — 애매하면 막는다. 밤 · 은행 · 아몬드 등은 group_foods 에 두고, 코코넛은 넣지 않는다 (#258 이슈 합의, #264 PM 리뷰 10-09)"
  - label: 콩
    aliases: [콩]
    codes: [5]
    includes: []
    guards: []
    source: '보호자가 적은 "콩" 은 대두로 읽고, 콩이 든 메뉴를 다 막는다. 대두만 막으려면 "대두" 로 등록한다 (#258, #264 PM 리뷰 10-09)'
  - label: 콩류
