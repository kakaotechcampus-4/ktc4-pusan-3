source: 식품 등의 표시기준 알레르기 유발물질 표시 대상
version: "2026"
fetched_at: 2026-09-27
# 확신 없는 별칭은 뺐다. 사람 교차 검수가 필요한 항목은 task-34-report.md 참고.
#
# 이 파일은 Food · Activity · Health 가 같이 읽는 "알레르기 이름 사전" 이다.
#   - aliases 에는 그 알레르기 식품 자체를 부르는 이름을 둔다 — 동의어 · 지역말 · 맞춤법 변형 · 외래어 ·
#     영어 이름(검사지에 영어로 적혀 온다) · 표시기준이 그 항목에 넣는 것(조개류의 굴 · 전복 · 홍합).
#     앞쪽의 가공식품 이름(두부 · 치즈 · 마요네즈 …)은 예전부터 있던 것이라 그대로 둔다.
#   - 그 성분이 든 음식 이름(빵 · 라면 · 어묵 …)은 여기 넣지 않는다. Food 전용
#     food_safety_terms.yaml 에 둔다 — 여기 넣으면 Activity 놀이 문장 · 문서 문장 검사도 같이 넓어진다.
#   - guards 는 별칭이 나온 자리를 덮는 "그 알레르기가 아닌 것" 이다. 그 알레르기 식품이 확실히
#     없는 것만 넣는다. 대두인 콩(메주콩 · 쥐눈이콩 · 검은콩)을 콩의 guard 에 넣으면 미탐이다.
