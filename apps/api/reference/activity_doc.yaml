# activity_doc 시드 — 프롬프트 [예시] 에 들어가는 놀이 예시 행 (D9 · RAG_plan Activity 절)
#
# 🚨 사실만 읽고 문장은 새로 쓴다. 원문 문장을 옮기지 않는다 (D10).
# 출처는 현행 「표준보육과정 고시」(교육부고시 제2024-23호, 2025-03-01 시행) 본문 하나다
# (public_law — 법령 · 고시는 저작권 보호 대상이 아니다). 국가법령정보센터 행정규칙 첨부 본문으로
# 대조했다. 0~1세 · 2세 · 3~5세(누리과정) 모두 5개 영역이다.
# source_locator 는 "연령 영역 · 내용범주 · 내용" 을 고시 문구 그대로 적는다.
# 행이 고시 "내용" 을 그대로 옮긴 놀이는 아니다 — 그 내용을 경험하는 놀이 하나를 우리가 지었다.
#
# 월령 구간: 0~1세 = 0–23개월, 2세 = 24–35개월, 3~5세 = 36–71개월 (만 나이)
#
# 행마다 테스트가 보는 것 (tests/unit/agents/activity/test_activity_doc_seed.py)
# - 그 행의 min_month 에서 위험 용어 사전이 title · body · 재료 어디에도 걸리지 않는다(경고 포함)
# - min_month < 18 이면 caregiver_role: together
# - 평가 표현(app/rules/evaluative.py)이 없다
# - 0–71개월 모든 월령이 행으로 덮인다 · 구간마다 [예시] 한 번 분량(5행) 이상
#
# 검수 — 작성자와 다른 사람이 고시 원문을 펴 놓고 사실 · 월령 · 출처 위치를 확인한 뒤
# status: approved 와 reviewed_by · reviewed_at 을 채운다. 서비스는 approved 만 쓴다.

