# 국가예방접종 표준접종 시기 — 0~155개월(만 12세까지) (Health `compute_vaccine_schedule`). 기준 연도 2026.
#
# 출처: 질병관리청 「2026 국가예방접종 지침」 표준예방접종 표(접종 권장시기) — 법적 근거는
#   「예방접종의 실시기준 및 방법」(질병관리청 고시) 별표 1. 이 파일에는 백신 이름과 숫자(개월)만
#   옮겼고 지침의 문장 · 표는 옮기지 않았다. 지침 PDF 는 공공누리 제4유형(출처표시 · 상업적이용금지 ·
#   변경금지)이다. 고시 별표 1 의 현행본과는 아직 대조하지 못했다.
#
# 단위: 개월. first_month · last_month 둘 다 포함하고, "N개월" 은 N개월 생일부터 N+1개월 생일 전날까지다
#   (예: 2개월 = 생후 2개월이 되는 날부터 3개월 생일 전날까지). "생후 4주 이내(BCG)" 는 0개월 칸이다.
#   B형간염 "출생 시" 도 0개월이다.
#
# 매년 지침이 나오면 새 파일 `vaccine_<연도>.yaml` 을 만들고 `reference.py` 의 `vaccine_table()` 이 읽는
# 파일 이름을 바꾼다. 값은 새 지침의 표와 한 번 더 대조하고 PR 에 대조 기록을 남긴다.
#
# 검진은 71개월에 끝나지만 접종은 계속된다. 만 4~6세 칸(DTaP · IPV · MMR)은 83개월까지이고,
# 만 6세 일본뇌염 4차 · 만 11~12세 Tdap · 만 12세 HPV · 일본뇌염 5차까지 표에 둔다. 156개월(만 13세)
# 부터는 이 표에 정해진 접종이 없다.
#
# 이 표에 없는 것 (일부러 뺐다)
#   - 인플루엔자 · 코로나19 : 절기마다 별도 공문으로 대상 · 횟수가 바뀐다
#   - 장티푸스 · 신증후군출혈열 : 고위험군 대상이라 일반 안내에 맞지 않는다
#   - HPV 2차(1차 후 6~12개월) · 만 13세 이후 HPV 시작 : 간격 계산을 하지 않는다
# HPV 는 지침이 "12세 남성 · 12~26세 여성" 으로 시작 대상을 정한다. 성별은 수집하지 않으므로 만 12세
# 칸 하나로만 안내한다.
#
# 해석을 한 칸 : A형간염 2차는 지침 표의 칸대로 24~35개월이다 (본문의 "1차 접종 후 6~12개월" 은
#   아이마다 다르므로 간격 계산은 하지 않는다).
