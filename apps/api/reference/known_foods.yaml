# 흔한 식재료 목록 — reference/known_foods.yaml
# 설계: app/agents/common/food_words.py (`ITEM` 규칙) · docs/agents/food/Food_Tool_명세.md `check_foods`
#
# 🚨 알레르기 판정 입력이다. 사람이 검수한다. 모델이 고르지 않는다.
#
# 사전(food_safety_terms.yaml)은 알레르기 · 연령 규칙에 걸리는 음식 위주라, 귤 · 오이 같은 흔한 재료는
# `check_foods(rules=ITEM)` 가 빈 튜플("확인 못 함")로 돌려줬다. 그러면 땅콩만 등록한 아이에게서도
# 귤 까기 · 오이 썰기 같은 활동이 다 빠진다(#582 리뷰). 항목 하나가 이 목록의 이름과 **통째로 같으면**
# 겹치는 걸 못 찾았다는 판정(막히지 않음)을 낸다. 등록한 이름과 같으면 그대로 막는다(귤 알레르기 아이의 귤).
#
# 넣는 기준
#   - 손질하지 않은 채소 · 과일 · 해조류와 소금 · 설탕 · 물 · 얼음만 둔다. 안에 숨은 성분이 없는 것이다
#   - 가공 · 조리한 것은 넣지 않는다 — 김치(젓갈) · 단무지 · 소스 · 기름(참기름은 참깨) · 죽 · 국 · 무침 ·
#     곤약 · 당면. 안에 든 재료를 몰라서 "막히지 않음" 이라고 말할 수 없다. 그 이름은 계속 빈 튜플이다
#   - 사전이 이미 아는 이름(감자 · 양파 · 마늘 · 쌀 …)은 넣지 않는다. 테스트가 본다
#   - 이름이 통째로 같을 때만 쓴다. 미역국의 미역 · 김치의 김으로는 판정하지 않는다
#
# 🚨 아이가 등록한 알레르기를 사전이 모두 읽을 수 있을 때만 쓴다. "과일" · "채소" · "해조류" 같은 묶음
#    이름은 사전이 읽지 못해서(귤이 그 묶음에 드는지 알 수 없다), 그런 알레르기가 있으면 전처럼 빈 튜플이다.
#    사전이 아는 이름이거나 이 목록의 이름 하나(배 · 귤)면 읽은 것이다. 식품 아닌 알레르기 표
#    (allergy_related_terms.yaml — 꽃가루 · 라텍스 · 동물털)의 이름은 건너뛴다. 보호자가 넓게 막으려고
#    쓰는 묶음 이름을 이 목록이 우회하지 않게 하려는 것이다
#
# 🚨 `ITEM` 규칙만 읽는다. 모든 아이의 후보에서 빼는 Growth 음식 용어 스캔은 읽지 않는다 — 읽으면
#    귤 까기 · 오이 썰기가 전원 손실이 된다. 섭취 확인(`QUESTION`)도 읽지 않는다(문구가 달라지는 일).
#
# 출처: 재료 정리 표(recipe_ingredients.yaml)에서 채소 · 과일 식품군이고 19종 코드가 없는 검수 완료 재료 중
# 사전이 모르는 것 + 놀이에 흔한 과일(귤 · 감 · 블루베리). 이름은 한 곳에 한 번만 적는다.

source: "재료 정리 표(recipe_ingredients.yaml)의 검수 완료 채소 · 과일 재료 + 흔한 과일 — 사람이 가공 여부를 보고 고름"
