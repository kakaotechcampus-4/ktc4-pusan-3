      upper: 40
      unit: mg
    carbohydrate:
      kind: amdr
      low: 50
      high: 65
      unit: "%kcal"
    fat:
      kind: amdr
      low: 15
      high: 30
      unit: "%kcal"
    sodium:
      kind: upper
      upper: 1500 # 만성질환위험감소섭취량(CDRR)
      unit: mg
    sugars:
      kind: upper
      upper: 20 # 총당류 — 연령 구분 없는 단일 권고
      unit: "%kcal"
    saturated_fat:
      kind: upper
      upper: 8 # %E 미만
      unit: "%kcal"
