# 섭취기준 — 정본은 docs/agents/food/영양소_계산_설계.md §2 · §6.
#
# 🚨 "정하는 것 ⑤" — 숫자는 상수로 쓴다. 원문 문장 · 표 구조 · 급원 식품 서술은 옮기지 않는다.
#    공공누리 제2유형(상업적 이용금지)은 그 저작물의 문장 · 표를 옮길 때 걸리고, 수치 자체는
#    저작권 대상이 아니다(docs/agents/shared/RAG_plan.md "소스 (#337)" 와 같은 입장 — 섭취기준은
#    문서 행 출처에서 빼고 수치만 이 상수 파일로 쓴다).
# 🚨 어느 지표에 EAR(kind: ear) · AMDR(kind: amdr) · 상한만(kind: upper)을 쓰는지는 원문이
#    아니라 영양소_계산_설계.md §6 "구간 판정" 표(우리 판단)를 따른다 — 일반 영양소(칼슘 · 철)는
#    EAR 로 부족을, 있으면 UL 로 과잉을 본다. 탄수화물 · 단백질 · 지방은 AMDR 범위로 저·고를
#    함께 본다. 나트륨 · 당류 · 포화지방은 상한만 있고 하한(low)이 없다.
#
# 출처 — 보건복지부 「2025 한국인 영양소 섭취기준」(국문요약본, 2025-12-31 발간,
# 발간등록번호 11-1352000-100416-13). 이 문서의 "2025 한국인 영양소 섭취기준" 표에서 옮겼다 —
# 같은 PDF 뒤쪽 부록에 있는 "2020 한국인 영양소 섭취기준 요약표"(비교용 구판)가 아니라 **2025
# 신판 표**에서 읽었다(칼슘 상한 · 나트륨 값이 2020 판과 다르다). 손으로 옮긴 값이라 2인 대조가
# 필요하다(food_agent_own_table.md §3 "손으로 옮긴 값은 2인 대조").
#
# 성별 — 모든 값은 "성별 구분 없는" 값이 아니라 이 연령대(1-2세 · 3-5세)에 애초에 성별 분리 행이
# 없는 원문 값이다(설계 §1 전제 6, N-6). 6세 이상부터 원문이 성별로 나뉜다 — 그 처리는 범위 밖.
#
# 에너지(energy) — 이번 Food 판정에는 쓰이지 않는다(§6 밖, "이번 범위 밖" 참고). 다만 refs_for 의
# 키 집합을 설계 인터페이스와 맞추려고 필요추정량(EER)을 ear 칸에 그대로 둔다 — compute_energy_target
# 을 구현할 때 연령군 일반값으로 재사용한다.
#
# 포화지방산 — 1-2세는 원문에 상한이 설정돼 있지 않다("–") 그대로 행을 만들지 않는다. 지어내지
# 않는다. 3-5세부터 8%E 미만이 설정된다.
# 당류 — 원문은 연령별 표가 아니라 "총당류를 총 에너지의 20% 이내로 제한한다"는 단일 문장이다.
# 연령 구분이 없어 두 그룹에 그대로 적용한다.

source: 보건복지부 「2025 한국인 영양소 섭취기준」 국문요약본 (2025-12-31, 발간등록번호 11-1352000-100416-13)
