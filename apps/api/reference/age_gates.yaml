# 월령 경계값의 정본 (#372). 코드 · 프롬프트 · 문서에 이 숫자를 복제하지 않는다
# (docs/agents/shared/연령별_Tool_전략.md §1 원칙 5). 로더는 app/agents/common/reference.py 의
# `age_gates()` 이고, 틀린 파일은 기본값으로 넘기지 않고 부팅 때 거부한다.
#
# 단위는 모두 개월이다. "이상" 은 그 월령이 되는 날부터, "미만" 은 그 월령이 되기 전까지다.
#
# 여기 없는 월령 숫자 — 규칙마다 출처가 붙은 것이라 숫자만 떼면 근거와 갈라진다.
#   food_safety_terms.yaml · hazard_terms.yaml 의 안전 규칙 월령(꿀 · 생우유 12, 질식 48, 축별 36 · 72 …)
#   → 단계 경계와 같아야 하는 값은 test_age_rule_months_match_their_single_source 가 이 파일과 맞춘다
#   common/reference.py 의 SAFETY_PROMOTE_BELOW_MONTH — 안전 경계가 같이 끌려가지 않게 일부러 따로 둔다
#   rules/nutrition.py 의 섭취기준 연령군 12 · 36 — 섭취기준 원문이 정한 연령군이다
#   rules/age.py 의 나이 문구 3 · 24 — 화면 문구 단위라 게이트가 아니다
#   growth/tools/delta.py 의 자세 측정 24 — 측정 방법(누워서 → 서서) 경계다
#   *_doc.yaml 행마다의 min_month · max_month — 행의 내용이다
#
# tool 이 열리는 월령 — Activity 는 어느 월령에서도 전부 열린다(0). Growth 는 education_min_month 아래에서
#   교육 tool 만 닫히고 나머지는 0 이다. 0 은 게이트가 아니라 "항상 열림" 이라 tool 이름 표는 각 Agent 의
#   gating.py 에 두고, 0 이 아닌 값만 여기서 읽는다.

source: docs/agents/shared/연령별_Tool_전략.md §2 전체 경계표 · docs/agents/shared/Tool_공통.md §2 · docs/agents/growth/Growth_Tool_명세.md §1 · docs/agents/activity/activity-agent-v1.md
version: "1"
fetched_at: 2026-10-13

# 단계 경계 — 월령이 이 값 이상이면 그 단계다. 선언 순서가 월령 순서다.
# 이유기 시작(infant_weaning 4)은 설정값이다 — 소아청소년과학회 자료로 확정한다 (연령별_Tool_전략 A-1).
# 나머지 12 · 36 은 Tool_공통.md §2 가 정한 값이다.
stage_boundaries:
  infant_milk: 0
  infant_weaning: 4
  toddler: 12
  preschool: 36

# v1 범위 상한 — 이 월령 미만(만 6세 전)까지가 서비스가 다루는 범위다 (연령별_Tool_전략 §2).
# 아이 등록을 막는 값이 아니다. 검진 · 접종 안내가 끝나는 경계이고, 문서 행 월령의 끝이다 (A-6).
# 아래 gates 의 값은 이 값을 넘을 수 없다.
v1_month_limit: 72

gates:
  # 관심 프로필(profile_affinity) 기준 월령 (연령별_Tool_전략 §2 · A-3).
  # 어린 월령의 단순 반사 행동을 성향으로 굳히지 않으려는 값이다. 두 곳이 같은 값을 쓴다 (#372 합의 2).
  #   Curator — 관찰한 날(기간 시작일)의 월령이 이 값 미만이면 새 연결·프로필 생성에서 제외한다.
  #             아이가 자라도 그 관찰은 제외된다. 기존 연결·생일 수정 후 정리는 별도 작업 (#391).
  #   Activity — 아이의 현재 월령이 이 값 미만이면 search_activity_memory 가 profile_affinity 를 읽지 않는다.
  # 읽는 쪽 게이트는 방어선이다 — 게이트가 생기기 전에 만들어진 행, 생일을 고친 아이의 옛 행이 근거로
  # 나가지 않게 한다. Curator 가 안 만든 월령은 어차피 0행이라 비용이 없다.
  affinity_min_month: 18

  # Activity — 이 월령 미만은 보호자가 같이 하는 활동만 낸다 (3-3). 밴드 경계와 따로 둔다.
  # 로그 편의로 밴드를 옮길 때 안전 경계가 같이 끌려가지 않게.
  together_only_below_month: 18

  # Growth — 교육 tool 이 열린다. 그 아래는 놀이가 곧 배움이라 Activity 로 안내한다.
  education_min_month: 12

  # Growth — 루틴이 안내 한 줄(rhythm_info)에서 다음 단계 제안(next_step)으로 넘어간다.
  step_min_month: 12

  # Growth — 예절 카테고리가 열린다. 설정값으로 시작한다 (G-7).
  manner_min_month: 24

  # Growth — 습관 교정 카테고리가 열린다. 설정값으로 시작한다 (G-7).
  # growth_doc 의 habit_strategy 행 min_month CHECK 와 같은 값이어야 한다.
  habit_min_month: 36
