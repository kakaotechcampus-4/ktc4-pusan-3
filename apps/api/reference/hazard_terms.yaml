# Activity 위험 용어 사전 — reference/hazard_terms.yaml
# 설계: docs/agents/activity/activity-agent-v1.md §3-5 · §4-1
#
# 🚨 월령(block/warn_below_month)과 출처는 축에만 적는다. 용어는 axis · label · aliases · guards 만 갖는다.
#    용어마다 월령을 적게 두면 그 순간부터 사람(또는 LLM)이 용어 단위로 월령을 판단하게 된다.
# 🚨 block/warn_below_month 는 사람이 정한다. 출처가 이미 정한 값을 옮긴 것이다.
# 🚨 위험이 형용사에 실린 말은 수식어를 포함해서만 등록한다 (작은 블록 O · 블록 X).
# 🚨 guard 에 "더 위험한 표현"을 넣지 않는다. guard 문구만 스캔하면 그 용어의 축에는 걸리지 않아야 한다.
#    다른 축으로 넘기는 guard 는 된다 (풍선 → 풍선껌은 food_choking 이 잡는다). 그 축이 잡으니 숨지 않는다.
# 0–17개월은 경고가 차단으로 올라간다 — 이 파일 값이 아니라 공용 판정 HazardAxis.level_at
#    (common/reference.py 의 SAFETY_PROMOTE_BELOW_MONTH = 18)이다. Activity · Growth 가 같이 읽는다.

source: 어린이제품 공통안전기준 · 완구 안전기준 · 도로교통법 · AAP · 질병관리청 · 식약처 — 축별 출처는 axes.*.source
version: "2026.1-p0"
fetched_at: 2026-10-02   # 축 출처 원문 확인일 — food_choking · suffocation_film 은 10-02, 나머지 축은 09-19 (round3 조사)

# 이 판에 없는 축. 있는 줄 알고 안 보는 일이 없게 이름을 남긴다.
pending_axes:
  height: P1 — 다음 판 (배포 전에 넣는다. 0–17개월 경고→차단 승격이 아기 그네를 막지 않게 따로 설계한다)
  wheeled_manual: P1 — 다음 판
  heat_burn: P2 — 다음 판
  strangulation: 보류 — 공통안전기준 본문에 끈 길이 조항이 없다 (임계값 출처 0)
  chemical: 보류 — 유아용 물감·풀까지 걸려 과차단이 크다. 성분별 근거 필요
  sharp: 보류 — 유아용 안전가위가 있어 "가위" 자체가 위험어가 아니다

axes:
  small_parts:
    block_below_month: 36
    warn_below_month: 72
    source: >-
      어린이제품 공통안전기준 3.2.1.1(36개월 미만 — 작은 부품 실린더에 완전히 들어가면 안 됨) ·
      3.2.1.2(36~72개월 미만 — 경고표시) · 3.2.4(자석)
      https://law.go.kr/행정규칙/어린이제품공통안전기준
    warning_text: 작은 부품은 삼킬 수 있어요. 아이 입에 들어가지 않는 크기인지 먼저 확인해 주세요.

  water:
    warn_below_month: 72
    source: >-
      질병관리청 2021–25 응급실 익수 505명 중 154명 사망, 0–9세가 여름철 익수의 51.1% ·
      영유아는 수심 5cm 에서도 익수 (임계 월령 없음 — 통계 근거)
      https://v.daum.net/v/20260725110210349
      http://hqcenter.snu.ac.kr/archives/jiphyunjeon/안전한-물놀이1-익수-사고-예방-및-대처법
    warning_text: 물놀이는 아이에게서 팔이 닿는 거리에서 한순간도 눈을 떼지 말아 주세요. 깊이 5cm 에서도 사고가 납니다.

  wheeled_motorized:
    block_below_month: 192
    source: >-
      도로교통법 — 원동기장치자전거면허는 16세 이상부터 취득 가능, 16세 미만은 전동킥보드 등 운전 불가
      https://easylaw.go.kr/CSP/OnhunqueansInfoRetrieve.laf?onhunqnaAstSeq=90&onhunqueSeq=5687

  trampoline:
    block_below_month: 72
    source: >-
      AAP — 6세 미만 트램펄린 사용 금지, 가정 설치 강력 비권장
      https://publications.aap.org/pediatrics/article/130/4/774/30158/Trampoline-Safety-in-Childhood-and-Adolescence
      (국내: 한국소비자원 가정 내 트램펄린 사고 220건 중 1–3세 56.4%)

  infant_walker:
    block_below_month: 72   # AAP 는 연령 무관 전면 금지 — 서비스 상한(72)으로 "전 구간 차단"을 옮긴 값
    source: >-
      AAP — 제조·판매 금지 권고, 1990–2014 미국 15개월 미만 약 231,000명 응급실, 사고의 2/3 가 계단 추락,
      손상의 75% 가 어른이 지켜보는 중 발생
      https://www.healthychildren.org/English/safety-prevention/at-home/Pages/baby-walkers-a-dangerous-choice.aspx
      | 국내 근거 없음 — 한국소비자원·질병관리청·KC 안전확인 기준에서 연령 권고 미확인 (2026-09-19 조사)

  food_choking:
    warn_below_month: 48
    source: >-
      AAP 정책성명 "Prevention of Choking Among Children" (Pediatrics 2010) — 4세 미만에게 통포도 ·
      견과류 · 팝콘 · 딱딱한 사탕 · 마시멜로 · 핫도그 · 껌 등을 주지 않는다 (잘게 자르지 않은 둥글고 단단한 음식)
      https://publications.aap.org/aapnews/article/32/4/16/10099/Preventing-choking-in-childrenMany-factors |
      식약처 — 곤약 젤리는 어린이 · 노약자 질식 위험으로 수입 불허 |
      Food 의 "질식 주의 식품 48개월"(연령별_Tool_전략.md §2 설정값)과 같은 값이다
    warning_text: 통째로 먹으면 목에 걸릴 수 있어요. 아주 작게 잘라 주고, 먹는 동안 곁에 있어 주세요.

  suffocation_film:
    warn_below_month: 96   # 8세 미만 — 서비스 상한(72)보다 커서 전 구간 경고
    source: >-
      안전확인대상 어린이제품의 안전기준 부속서 6(완구) 풍선 의무 경고표시 — "8세 미만의 어린이는
      부풀리지 않은 풍선 또는 터진 풍선에 의해 기도가 막혀 질식할 수 있음. 성인의 통제를 요함"
      https://www.law.go.kr/LSW/admRulLsInfoP.do?admRulSeq=2100000216783 |
      미국 16 CFR 1500.19 도 같은 8세 경고를 의무로 둔다 https://ecfr.io/Title-16/Section-1500.19 |
      어린이제품 공통안전기준 — 포장용 비닐은 두께 0.038mm 이상 (얇은 비닐이 코 · 입에 붙어 질식, 조항 번호 원문 대조 필요)
    warning_text: 터진 풍선 조각과 비닐은 입에 넣거나 얼굴에 쓰지 않게 지켜봐 주세요. 놀이가 끝나면 손이 닿지 않는 곳에 치워 주세요.

terms:
  # 검수로 뺀 것 — 다시 넣지 않는다. test_hazard_terms.py 의 MUST_PASS 가 막는다.
  #   감독하면 위험이 없어지는 놀이다. 작은 부품 축은 36개월 미만이 차단이라 목록에 남기면 보호자가
  #   옆에 있어도 추천이 막힌다 (설계 4-1 "감독으로 위험이 실질적으로 제거되면 경고").
  #   10-02  생쌀(쌀 촉감놀이) · 물웅덩이(비 온 뒤 첨벙 놀이) · 볼트 · 너트 · 나사(큰 플라스틱 조립 장난감)
  #   09-29  면봉 · 모루 · 반짝이 가루 · 시리얼 · 탱탱볼 · 전동 카트
  #   예외(guard)로 돌린 것은 각 용어의 guards 에 있다 — 자석 낚시 · 레고 듀플로 · 호수공원 · 강변 산책 등
  # 남겨 둔 것 — 마른 콩 · 마카로니 · 단추는 삼키면 기도를 막는 크기라 그대로 차단이다.

