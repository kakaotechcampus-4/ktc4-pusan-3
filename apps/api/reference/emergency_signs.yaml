# 응급 신호 사전 — 보호자 발화에 이 말이 있으면 Supervisor 보다 먼저 119 · 응급실 안내가 나간다.
# Health_Agent_명세 §9 "응급 신호 후보" — H-1(응급 신호 원문 대조) 검수 대기.
# 읽는 쪽은 app/agents/supervisor/emergency.py, 맞추는 규칙은 app/rules/emergency.py.
#
# 🚨 medical_reviewed: false 여도 이 사전은 켠다 (infant_fever.yaml 과 같은 이유, 10-23 결정).
#    끄면 응급 신호에 안내가 사라진다. 놓치는 쪽이 더 위험하다.
#    그 대신 표현은 "아이가 지금 그렇다" 는 말에만 걸리게 좁혀 둔다. 걸리지 않아야 할 말이 걸리면
#    도메인 Agent 가 전부 빠지기 때문이다. 그래서 guards(오탐 취소)를 둔다 —
#    "경련 얘기를 들었어" · "숨쉬기 힘들지 않아" 는 걸지 않는다.
#
# 표현 쓰는 법
#   - 띄어쓰기 · 문장부호는 무시하고 비교한다(app/rules/term_match.py 의 normalize).
#     단 infant_fever 행은 낱말을 넘지 않는다 — 별칭에 없는 띄어쓰기를 넘어 맞추지 않는다. 생일만으로
#     3개월 미만 아이의 모든 말에 돌아서, 짧은 별칭이 "먹고 열심히" 의 "고열" 처럼 앞뒤 낱말에 걸친다.
#     그래서 이 행은 띄어 쓸 수 있는 자리를 별칭에 띄어 적는다 — "열 나" 는 "열나" · "열 나" 둘 다 잡고,
#     "열나" 로 적으면 "열 나요" 를 놓친다. guard 도 같다.
#   - 비교는 글자(음절) 단위 부분 일치다. 한국어는 활용에서 글자가 바뀐다(토해 → 토했 · 힘들 → 힘든 ·
#     나 → 났). 그래서 활용형마다 별칭을 따로 둔다 — "토해" 만 두면 "토했어" 를 놓친다.
#   - all_of 는 묶음의 목록이다. 묶음마다 aliases 중 하나가 나와야 하고, 묶음이 전부 나와야 걸린다.
#     예) head_injury 는 "머리를 부딪" 류 한 묶음 + "토해" 류 한 묶음이 둘 다 있어야 한다.
#   - guards 는 그 묶음의 별칭이 나온 자리를 덮는 말이다. 자기 별칭을 품어야 한다("경련 얘기" 는
#     "경련" 을 덮는다). 별칭과 같으면 그 별칭이 통째로 꺼지므로 안 된다. 부정("안 해" · "없었어" ·
#     "하지 않았어")은 어미마다 따로 둔다.
#   - 남에게 들은 말("친구가 경련했대")은 거르지 않는다. 우리 아이가 어린이집에서 경련했다는 전달과
#     글자로 구분되지 않는다. 놓치는 쪽이 더 위험하다.
#   - infant: true 는 infant_fever 한 행뿐이다. 발화에 적힌 월령이나 생일로 계산한 월령이 기준 미만일
#     때만 걸린다. 별칭 대신 열 이야기 속의 기준 이상 체온("열이 38도야")으로도 걸린다. 월령 · 체온
#     기준은 infant_fever.yaml 한 곳에 있다 — 여기에 숫자를 두지 않는다.
#   - 3개월 이상은 열 이야기로 걸지 않는다("고열" 이라고 해도 같다). 체온 숫자로도 걸지 않는다. 체온 없이
#     열을 말하면 기록하고 코드가 몇 도인지 되묻는다(pipeline).
#
# 알려진 한계 (H-1 검수에서 정한다)
#   - "목이 부었어" 는 swelling 별칭에서 뺐다. 편도염 · 인후염을 흔히 이렇게 말해서 아이 상태가 아닌
#     말처럼 119 안내가 가장 많이 나갈 말이다. 목이 붓고 숨쉬기 힘들면 breathing 이 잡는다.
#   - 아침 붓기("자고 일어났더니") · 모기 물린 자리 붓기는 guard 로 뺐다. 벌 · 음식 뒤 붓기는
#     그대로 걸린다.
#   - 경기는 시합 말("달리기 경기를 했어")이 흔해서 주어 · 때를 말하는 말 바로 뒤와 "경기해요" 만 건다.
#     그래서 "어젯밤 경기를 했어" 는 놓치고 "오늘 농구 경기해요" 는 걸린다.
#   - 생일 월령이 기준 미만이면 아이 말이 아닌 열("엄마가 열이 나")과 지난 열("지난달에 열이 났어")에도
#     걸린다. "열 있는지 모르겠어" · "열감기 걸린 친구" 도 걸린다. 누구의 언제 열인지 글자로 가르지
#     않는다. 놓치는 쪽이 더 위험하다.
#   - "고열 안 났어" 는 guard 로 빼지 않았다. 같은 자리의 "고열이 안 떨어져요" 가 진짜 발열이다.
#   - "반응이 없" 은 "새 장난감엔 반응이 없더라" 에도 걸린다. "아이가 반응이 없어" 를 놓치지 않으려고
#     넓게 두었다.
#
# 검수 — 응급 신호는 의료 검수 필수다.
#   ① 표현이 증상을 제대로 가리키는가 ② 출처가 "지금 바로 119 · 응급실" 강도의 안내를 이 증상에
#   하는가. 마치면 그 행의 medical_reviewed: true 와 reviewed_by(GitHub 아이디) · reviewed_at 을
#   채운다. 표현이 바뀌면 이 파일만 고친다.

