# 배포용. 로컬 개발 DB 는 옆의 docker-compose.yml 이고, 이 파일과 섞지 않는다 —
# 개발 DB 는 "내 노트북에서 apps/api 를 돌리기 위한 것" 이고, 여기 있는 것은 "서버에서 서비스되는 것" 이다.
#
#   cp .env.example .env    (최초 1회, 값 채우기)
#   make api-image          API 이미지 굽기
#   make web-image          프론트 이미지 굽기
#   make deploy-up          전체 기동 (db + redis + api + web + caddy)
#   make deploy-down        전체 중지
#
# Caddy 가 HTTPS 종단 + 리버스 프록시를 맡는다.
#   icatch.ai.kr       → ktc4-web:3000   (주소는 컨테이너 이름이다 — ktc4-edge 에서 서비스 이름 web · api 는
#   api.icatch.ai.kr   → ktc4-api:8000    dev · 운영 둘 다로 풀린다. deploy/caddy/Caddyfile)
# web · api 는 호스트 포트를 열지 않는다 — Caddy 만 80/443 을 낸다.
# 🚨 api 는 --workers 1 이다. run 진행 상황이 프로세스 메모리에 있어서 (#134)
#    둘 이상이면 POST 받은 프로그램과 GET 받은 프로그램이 갈려 조용히 404 가 난다.
# 🚨 로그는 전 서비스 journald 다 (아래 x-logging). docker 기본 json-file 은 새 이미지로 up 할 때 컨테이너와
#    함께 로그가 지워진다 — journald 면 OS 에 남고 `docker compose logs` 도 그대로 된다.
#    이유는 docs/ops/logging-alerts-v1.md (멘토 #267 2번).
#    로그 설정은 컨테이너를 만들 때 정해진다 — 나중에 바꾸면 다시 올려야 적용된다.

x-logging: &logging
  # 서버(Ubuntu 24.04)는 journald. 맥의 Docker Desktop 에는 journald 가 없어서 배포 compose 를 로컬에서
  # 띄워 볼 때만 deploy/docker/.env 에 LOG_DRIVER=json-file 을 둔다 (빌드 `make web-image` 는 상관없다).
  driver: ${LOG_DRIVER:-journald}

# 🚨 prod 는 이 이름 그대로다 — 바꾸면 named volume(DB 데이터) 이름도 바뀌어 빈 DB 가 뜬다.
#    dev 는 그 checkout 의 .env 에 COMPOSE_PROJECT_NAME=ktc4-dev 를 둬서 덮는다 (.env.example · docs/ops/deploy-v1.md).
name: ktc4-deploy

services:
  caddy:
    image: caddy:2.10.0-alpine
    container_name: ktc4-caddy
    # 80/443 은 서버에 하나뿐이라 Caddy 는 prod 프로젝트에만 뜬다 — prod .env 에 COMPOSE_PROFILES=edge.
    # dev 의 web · api 도 이 Caddy 가 ktc4-edge 네트워크로 받는다 (deploy/caddy/Caddyfile).
    profiles: [edge]
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 파일이 아니라 폴더째 붙인다. 파일 하나를 붙이면 git reset 이 파일을 새로 만들 때(inode 교체) 컨테이너는
      # 옛 파일을 계속 본다. 바꾼 Caddyfile 은 deploy.sh 가 prod 배포 성공 뒤 caddy reload 로 읽힌다.
      - ../../deploy/caddy:/etc/caddy:ro
      - ktc4-caddy-data:/data
      - ktc4-caddy-config:/config
    # 🚨 depends_on(api · web) 을 두지 않는다. 있으면 compose 가 api · web 을 새로 만들 때마다 Caddy 를 먼저
    #    멈춰서, 운영 배포마다 dev 도 같이 끊기고 실패하면 롤백 내내 Caddy 가 꺼져 있다 (#753).
    #    Caddy 는 요청마다 이름을 찾으므로 api · web 이 늦게 떠도 그동안 502 일 뿐이다.
    networks:
      edge:
        ipv4_address: 172.30.0.10

  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: ktc4${STACK_SUFFIX:-}-postgres-deploy
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ktc4-postgres-deploy-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ktc4${STACK_SUFFIX:-}-redis-deploy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/api
    # 이름 꼬리(STACK_SUFFIX) — prod 는 비어 있어 지금 이름 그대로, dev 는 -dev. 컨테이너 이름이 곧
    # Caddy 가 찾는 주소이고 journalctl CONTAINER_NAME= 의 값이다.
    # 태그는 커밋 sha (deploy/scripts/deploy.sh) — 직전 태그가 롤백할 곳이다.
    image: ktc4${STACK_SUFFIX:-}-api:${API_IMAGE_TAG:-local}
    container_name: ktc4${STACK_SUFFIX:-}-api
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      TZ: Asia/Seoul
      APP_NAME: ktc4-pusan-3-api
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Caddy 가 넘긴 X-Forwarded-For 만 믿는다. "*" 는 위조가 열려서 금지.
      # invite-v1.md §IP 를 얻는 법 참조.
      FORWARDED_ALLOW_IPS: 172.30.0.10
      # CORS_ALLOW_ORIGINS 는 여기 두지 않는다 — environment 가 env_file 보다 우선해서
      # 빈칸이 apps/api/.env 값을 덮는다. apps/api/.env 에서만 관리한다.
      # 나머지 키(LLM·OAuth·외부 API)는 apps/api/.env 에서 직접 주입한다.
      # 여기에 일일이 나열하면 키가 추가될 때마다 두 곳을 고쳐야 한다.
    env_file:
      - path: ../../apps/api/.env
        required: false
    volumes:
      # FCM 서비스 계정 키 (#594) — 서버에 둔 파일을 읽기 전용으로 붙인다. 키를 이미지 · 저장소에
      # 넣지 않으려는 것이다. FCM_KEY_PATH 를 비우면 빈 파일이 붙는다 — apps/api/.env 의
      # FCM_SERVICE_ACCOUNT_FILE 도 비워 두면 알림 발송 배치만 돌지 않는다.
      - ${FCM_KEY_PATH:-/dev/null}:/run/secrets/fcm-service-account.json:ro
    # 호스트 포트를 열지 않는다 — Caddy 가 edge 네트워크로 리버스 프록시한다.
    expose:
      - "8000"
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # 120s — 이 동안의 실패는 세지 않고, 한 번 통과하면 바로 healthy 다(평소 배포는 안 느려진다).
      # deploy.sh 의 up --wait 가 이 판정으로 롤백을 정한다. 서버는 평소 9초에 뜨지만 dev · prod 빌드가 겹쳐
      # swap 을 쓸 때는 훨씬 느리다 — 15s 면 멀쩡한 배포가 롤백된다 (#747 로컬 리허설에서 2분 20초를 봤다).
      start_period: 120s

  web:
    build:
      context: ../../apps/web
      args:
        # 🚨 이 값은 빌드 시점에 번들에 박힌다. 바꾸면 컨테이너 재시작이 아니라 재빌드다
        #    (apps/web/Dockerfile 머리말).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        # 웹 푸시 (#609). 비어 있으면 웹 푸시가 꺼진 이미지가 된다 (deploy/docker/.env.example).
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    # 🚨 web 은 API 주소가 번들에 박힌다 — 같은 커밋이라도 dev · prod 이미지가 따로 있어야 해서 이름을 나눈다.
    image: ktc4${STACK_SUFFIX:-}-web:${WEB_IMAGE_TAG:-local}
    container_name: ktc4${STACK_SUFFIX:-}-web
    restart: unless-stopped
    logging: *logging
    environment:
      # Next 서버에서 난 오류를 Discord 로 (apps/web/src/instrumentation.ts). 빌드가 아니라 실행 때 읽는다.
      # 비어 있으면 안 보낸다. api · 감시 스크립트와 같은 값 — 브라우저 번들엔 안 들어간다.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # 알림 꼬리표 [prod] · [dev]. 감시 스크립트도 같은 줄을 읽는다 — 시험 서버는 .env 에 APP_ENV=dev.
      APP_ENV: ${APP_ENV:-prod}
    # 호스트 포트를 열지 않는다 — Caddy 가 edge 네트워크로 리버스 프록시한다.
    expose:
      - "3000"
    networks:
      - default
      - edge
    healthcheck:
      # 00 로그인 화면. 서버 렌더만으로 그려져서 API 가 죽어 있어도 200 이 나온다 —
      # 여기서 보려는 것은 "Next 가 떠 있는가" 뿐이다.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# default 는 프로젝트마다 따로 생긴다 (db · redis 는 여기만). 고정 subnet 을 두지 않는다 — 두 프로젝트가 겹친다.
# edge 는 두 프로젝트가 같이 쓰는 바깥 네트워크 (172.30.0.0/24). deploy.sh 가 없으면 만든다.
networks:
  edge:
    name: ktc4-edge
    external: true

volumes:
  ktc4-postgres-deploy-data:
  ktc4-caddy-data:
  ktc4-caddy-config:
