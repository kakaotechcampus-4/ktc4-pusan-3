# 배포용. 로컬 개발 DB 는 옆의 docker-compose.yml 이고, 이 파일과 섞지 않는다 —
# 개발 DB 는 "내 노트북에서 apps/api 를 돌리기 위한 것" 이고, 여기 있는 것은 "서버에서 서비스되는 것" 이다.
#
#   cp .env.example .env    (최초 1회, 값 채우기)
#   make web-image          이미지 굽기
#   make web-up             띄우기
#
# 지금은 web 하나다. api 와 nginx 가 여기 합류한다 — 그때 web 의 ports 를 지우고
# nginx 뒤로 넣는다 (지금은 앞에 아무것도 없어서 포트를 직접 낸다).
# 🚨 api 는 --workers 1 이다. run 진행 상황이 프로그램 메모리에 있어서 (#134)
#    둘 이상이면 POST 받은 프로그램과 GET 받은 프로그램이 갈려 조용히 404 가 난다.
# 🚨 로그는 전 서비스 journald 다 (아래 x-logging). docker 기본 json-file 은 새 이미지로 up 할 때 컨테이너와
#    함께 로그가 지워진다 — journald 면 OS 에 남고 `docker compose logs` 도 그대로 된다. api 가 합류하면
#    `logging: *logging` 한 줄만 더한다. 이유는 docs/ops/logging-alerts-v1.md (멘토 #267 2번).
#    바꾼 뒤에는 서버에서 `make web-up` 으로 컨테이너를 다시 올려야 적용된다.

x-logging: &logging
  # 서버(Ubuntu 24.04)는 journald. 맥의 Docker Desktop 에는 journald 가 없어서 배포 compose 를 로컬에서
  # 띄워 볼 때만 deploy/docker/.env 에 LOG_DRIVER=json-file 을 둔다 (빌드 `make web-image` 는 상관없다).
  driver: ${LOG_DRIVER:-journald}

services:
  redis:
    image: redis:7-alpine
    container_name: ktc4-redis-deploy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../apps/web
      args:
        # 🚨 이 값은 빌드 시점에 번들에 박힌다. 바꾸면 컨테이너 재시작이 아니라 재빌드다
        #    (apps/web/Dockerfile 머리말).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    image: ktc4-web:${WEB_IMAGE_TAG:-local}
    container_name: ktc4-web
    restart: unless-stopped
    logging: *logging
    ports:
      - "${WEB_PORT}:3000"
    healthcheck:
      # 00 로그인 화면. 서버 렌더만으로 그려져서 API 가 죽어 있어도 200 이 나온다 —
      # 여기서 보려는 것은 "Next 가 떠 있는가" 뿐이다.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
