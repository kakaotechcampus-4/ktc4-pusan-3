# 배포용. 로컬 개발 DB 는 옆의 docker-compose.yml 이고, 이 파일과 섞지 않는다 —
# 개발 DB 는 "내 노트북에서 apps/api 를 돌리기 위한 것" 이고, 여기 있는 것은 "서버에서 서비스되는 것" 이다.
#
#   cp .env.example .env    (최초 1회, 값 채우기)
#   make api-image          API 이미지 굽기
#   make web-image          프론트 이미지 굽기
#   make deploy-up          전체 기동 (db + redis + api + web + caddy)
#   make deploy-down        전체 중지
#
# Caddy 가 HTTPS 종단 + 리버스 프록시를 맡는다.
#   icatch.ai.kr       → web:3000
#   api.icatch.ai.kr   → api:8000
# web · api 는 호스트 포트를 열지 않는다 — Caddy 만 80/443 을 낸다.
# 🚨 api 는 --workers 1 이다. run 진행 상황이 프로세스 메모리에 있어서 (#134)
#    둘 이상이면 POST 받은 프로그램과 GET 받은 프로그램이 갈려 조용히 404 가 난다.
# 🚨 로그는 전 서비스 journald 다 (아래 x-logging). docker 기본 json-file 은 새 이미지로 up 할 때 컨테이너와
#    함께 로그가 지워진다 — journald 면 OS 에 남고 `docker compose logs` 도 그대로 된다.
#    이유는 docs/ops/logging-alerts-v1.md (멘토 #267 2번).
#    로그 설정은 컨테이너를 만들 때 정해진다 — 나중에 바꾸면 다시 올려야 적용된다.

x-logging: &logging
  # 서버(Ubuntu 24.04)는 journald. 맥의 Docker Desktop 에는 journald 가 없어서 배포 compose 를 로컬에서
  # 띄워 볼 때만 deploy/docker/.env 에 LOG_DRIVER=json-file 을 둔다 (빌드 `make web-image` 는 상관없다).
  driver: ${LOG_DRIVER:-journald}

name: ktc4-deploy

services:
  caddy:
    image: caddy:2.10.0-alpine
    container_name: ktc4-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ktc4-caddy-data:/data
      - ktc4-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.10

  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: ktc4-postgres-deploy
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ktc4-postgres-deploy-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ktc4-redis-deploy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/api
    image: ktc4-api:${API_IMAGE_TAG:-local}
    container_name: ktc4-api
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      TZ: Asia/Seoul
      APP_NAME: ktc4-pusan-3-api
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Caddy 가 넘긴 X-Forwarded-For 만 믿는다. "*" 는 위조가 열려서 금지.
      # invite-v1.md §IP 를 얻는 법 참조.
      FORWARDED_ALLOW_IPS: 172.30.0.10
      # CORS_ALLOW_ORIGINS 는 여기 두지 않는다 — environment 가 env_file 보다 우선해서
      # 빈칸이 apps/api/.env 값을 덮는다. apps/api/.env 에서만 관리한다.
      # 나머지 키(LLM·OAuth·외부 API)는 apps/api/.env 에서 직접 주입한다.
      # 여기에 일일이 나열하면 키가 추가될 때마다 두 곳을 고쳐야 한다.
    env_file:
      - path: ../../apps/api/.env
        required: false
    # 호스트 포트를 열지 않는다 — Caddy 가 리버스 프록시한다.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../../apps/web
      args:
        # 🚨 이 값은 빌드 시점에 번들에 박힌다. 바꾸면 컨테이너 재시작이 아니라 재빌드다
        #    (apps/web/Dockerfile 머리말).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        # 웹 푸시 (#609). 비어 있으면 웹 푸시가 꺼진 이미지가 된다 (deploy/docker/.env.example).
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    image: ktc4-web:${WEB_IMAGE_TAG:-local}
    container_name: ktc4-web
    restart: unless-stopped
    logging: *logging
    environment:
      # Next 서버에서 난 오류를 Discord 로 (apps/web/src/instrumentation.ts). 빌드가 아니라 실행 때 읽는다.
      # 비어 있으면 안 보낸다. api · 감시 스크립트와 같은 값 — 브라우저 번들엔 안 들어간다.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # 알림 꼬리표 [prod] · [dev]. 감시 스크립트도 같은 줄을 읽는다 — 시험 서버는 .env 에 APP_ENV=dev.
      APP_ENV: ${APP_ENV:-prod}
    # 호스트 포트를 열지 않는다 — Caddy 가 리버스 프록시한다.
    expose:
      - "3000"
    healthcheck:
      # 00 로그인 화면. 서버 렌더만으로 그려져서 API 가 죽어 있어도 200 이 나온다 —
      # 여기서 보려는 것은 "Next 가 떠 있는가" 뿐이다.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  ktc4-postgres-deploy-data:
  ktc4-caddy-data:
  ktc4-caddy-config:
