# `compose run` 으로 띄우는 일회용 api 상자(마이그레이션 · 적재)에만 덧씌운다.
# deploy.sh 와 Makefile deploy-migrate · deploy-load-* 가 docker-compose.deploy.yml 뒤에 -f 로 붙인다. up 에는 붙이지 않는다.
#
# 🚨 run 은 서비스의 네트워크 설정을 그대로 가져간다. api 의 ktc4-edge 고정 주소(.20 · .21)는 떠 있는 api 가
#    이미 쓰고 있어서, 그대로 두면 "Address already in use" 로 마이그레이션이 멈추고 배포가 빨간불이 된다.
#    일회용 상자는 Caddy 에서 받을 일도 메타데이터(S3 열쇠)에 닿을 일도 없어서 default 하나면 된다.
#    db 는 default 에 있고, 적재가 부르는 바깥 API 는 default 로도 나간다(서버 방화벽은 메타데이터 주소만 막는다).
# !override 는 compose v2.24.4 부터 읽는다.
services:
  api:
    networks: !override
      default: {}
