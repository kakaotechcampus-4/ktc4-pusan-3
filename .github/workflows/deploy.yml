name: 배포
# develop → dev(dev.icatch.ai.kr) · main → prod(icatch.ai.kr). 둘 다 같은 EC2 한 대에 compose 프로젝트로 따로 뜬다.
# 흐름: API CI + Web CI 통과 → SSM 으로 서버의 deploy/scripts/deploy.sh 실행 → 헬스 실패면 그 스크립트가 직전 이미지로 되돌린다.
# 자세한 건 docs/ops/deploy-v1.md.

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "배포 전 백업을 건너뛴다 — DB 컨테이너가 죽어 백업이 안 되는데 그걸 고치는 배포일 때만 (#758)"
        type: boolean
        default: false

# 같은 브랜치끼리만 줄을 세운다 — 순서가 뒤집혀 옛 커밋이 새 커밋을 덮지 않게.
# dev · prod 가 동시에 빌드하면 4GB 서버가 넘치는 것은 서버 쪽 deploy.sh 의 flock 이 막는다.
# (여기서 그룹 하나로 묶으면 대기열이 1칸이라 main 대기를 develop 이 밀어낼 수 있다.)
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  api-ci:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-api.yml

  web-ci:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-web.yml

  deploy:
    needs: [api-ci, web-ci]
    runs-on: ubuntu-latest
    # 🚨 environment 를 쓰면 OIDC 토큰의 sub 가 repo:<저장소>:environment:<dev|prod> 로 바뀐다.
    #    IAM 역할 ktc-github-deploy 의 신뢰 정책이 그 값을 받아야 한다 (docs/ops/deploy-v1.md §준비).
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    # 다른 환경 배포를 기다리는 flock(최대 20분) + 빌드 · 기동 · 롤백(최대 ~18분). 서버 실행 상한(40분)보다 조금 길게.
    timeout-minutes: 45
    env:
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      # push 배포에는 inputs 가 없어 늘 빈 값 — 늘 백업한다. 손으로 돌릴 때 켜면 1 (#758)
      SKIP_BACKUP: ${{ inputs.skip_backup && '1' || '' }}
    steps:
      - name: 배포 전 백업 건너뜀 표시
        if: inputs.skip_backup
        run: echo "::warning::배포 전 백업을 건너뛴다 — ${{ github.actor }} 가 skip_backup 으로 실행했다"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      # deploy.sh 는 git reset 전에 돌아야 하므로 그 커밋의 것을 꺼내 돌린다 — 서버에 남은 옛 스크립트가 아니라.
      # 🚨 꺼낸 파일은 실행마다 새 임시 파일이다. 경로를 고정하면 dev 가 도는 중에 prod 가 덮어써서,
      #    bash 가 읽던 위치부터 다른 파일을 읽는다.
      # 🚨 --timeout-seconds 는 "전달 대기" 시간이다. 실행 상한은 executionTimeout 이고 기본 3600초라 따로 준다.
      - name: EC2에 배포 명령 전송
        id: ssm
        run: |
          PARAMS=$(jq -n --arg dir "$DEPLOY_DIR" --arg ref "$REF_NAME" --arg sha "$SHA" --arg env "$TARGET_ENV" --arg skip "$SKIP_BACKUP" '{
            executionTimeout: ["2400"],
            commands: [
              "set -e",
              "export HOME=/root",
              "cd \($dir)",
              "git config --global --get-all safe.directory | grep -qx \($dir) || git config --global --add safe.directory \($dir)",
              "git fetch --quiet origin \($ref)",
              "F=$(mktemp /tmp/ktc4-deploy.XXXXXX)",
              "trap \"rm -f $F\" EXIT",
              "git show \($sha):deploy/scripts/deploy.sh > $F",
              "SKIP_PREDEPLOY_BACKUP=\($skip) bash $F \($sha) \($env)"
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: 배포 결과 확인
        run: |
          # 10초 간격 × 240회 = 40분 = 서버 실행 상한(executionTimeout). 서버가 먼저 끝나면 그 상태를 받는다.
          for i in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "[$i/240] Status: $STATUS"

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              # 성공해도 출력을 남긴다 — 어느 태그가 올라갔는지 Actions 에서 바로 보이게.
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query '{Output:StandardOutputContent,Error:StandardErrorContent}'
              if [ "$STATUS" = "Success" ]; then
                echo "배포 성공"
                exit 0
              fi
              # 실패 = 새 버전이 안 떴다. 롤백했는지는 위 출력의 "롤백" 줄로 본다.
              echo "배포 실패: $STATUS"
              exit 1
            fi

            sleep 10
          done

          echo "배포 시간 초과 (40분)"
          exit 1
