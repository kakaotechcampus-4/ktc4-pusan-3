# 서버 밖에서 매일 백업이 실제로 쌓이는지 본다 (#758).
#
# 서버의 cron 이 통째로 멈추면 backup.sh 도 restore-check.sh 도 돌지 않아 아무도 말하지 않는다.
# 서버가 죽은 건 UptimeRobot 이 잡지만, 서버는 살아 있고 cron 만 멈춘 건 밖에서 봐야 한다.
# 그래서 매일 03시 백업 · 복원 점검이 끝난 뒤 백업 버킷의 <환경>/daily/ 목록에서 가장 새 객체의
# 시각만 보고, 26시간이 넘었으면 Discord 로 한 줄 보낸다.
#
# 🚨 목록(키 · 시각)만 본다. 덤프는 받지 않는다 — 버킷 정책이 EC2 역할이 아닌 쪽의 객체 읽기를
#    막고 있고(#758), 덤프가 러너로 오면 미국으로 나가는 국외 이전이다. 목록 조회만 열려 있다.
# 🚨 공개 저장소라 Actions 로그도 공개다. 버킷 이름 · 웹훅은 secrets 로만 받고 로그에 찍지 않는다.
#
# 저장소 Settings › Secrets and variables › Actions 에 둘:
#   BACKUP_S3_BUCKET           백업 버킷 이름 (서버 deploy/docker/.env 와 같은 값)
#   BACKUP_ALERT_WEBHOOK_URL       운영 알림 채널의 Discord 웹훅 (prod checkout .env 의 ALERT_WEBHOOK_URL 과 같은 값)
#   BACKUP_ALERT_WEBHOOK_URL_DEV   개발 알림 채널의 Discord 웹훅 (dev checkout .env 의 ALERT_WEBHOOK_URL 과 같은 값)
# 알림은 환경마다 그 환경의 채널로 간다 — 서버의 backup.sh 가 checkout 마다 자기 .env 의 웹훅으로 보내는 것과 같다.
# 예약 실행은 기본 브랜치(develop)의 이 파일로만 돈다. 손으로 돌리려면 Actions › 백업 감시 › Run workflow.

name: 백업 감시

on:
  schedule:
    - cron: "30 19 * * *" # 매일 04:30 KST — 03시 백업 · 복원 점검이 끝난 뒤
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 매일 백업 cron 이 걸린 환경만 넣는다 — 아직 안 건 환경을 넣으면 매일 "하나도 없다" 가 운다.
      # dev 는 11-09, prod 는 11-11 에 cron 을 걸고 손으로 한 번 돌렸다(docs/ops/backup-restore-v1.md 2장).
      ENVS: prod dev
      MAX_AGE_SECONDS: "93600" # 26시간 — restore-check.sh 와 같은 기준
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      - name: 매일 백업이 26시간 안에 있는지
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          for e in $ENVS; do
            # 조회가 실패하면 여기서 멈춘다(set -e) — "백업이 없다" 와 "볼 수 없다" 를 섞지 않는다.
            listing="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$e/daily/" \
              --query 'Contents[].LastModified' --output text)"
            # 비어 있으면 aws 가 "None" 을 낸다. ISO 시각이라 글자 순 정렬이 곧 시간 순이다.
            latest="$(printf '%s\n' "$listing" | tr '\t' '\n' | grep -v -e '^None$' -e '^$' | sort | tail -n 1 || true)"
            if [ -z "$latest" ]; then
              echo "[$e] 매일 백업이 하나도 없다 — 서버 cron 을 본다" | tee -a "problems-$e.txt"
              continue
            fi
            age=$(( now - $(date -d "$latest" +%s) ))
            echo "$e: 가장 최근 매일 백업 $((age / 3600))시간 $((age % 3600 / 60))분 전"
            if [ "$age" -gt "$MAX_AGE_SECONDS" ]; then
              echo "[$e] 가장 최근 매일 백업이 $((age / 3600))시간 전이다 — 서버 cron 을 본다" | tee -a "problems-$e.txt"
            fi
          done
          # 모든 환경의 목록을 끝까지 읽었다는 표시 — 없으면 다음 단계가 "감시 자체가 실패" 로 본다.
          touch checked
          if ls problems-*.txt > /dev/null 2>&1; then
            exit 1
          fi

      # 백업이 밀린 것뿐 아니라 감시 자체가 실패해도(AWS 인증 · 목록 조회) 알린다 — 조용히 멈추면 이 파일이 있는 의미가 없다.
      - name: 실패하면 Discord 로 한 줄
        if: failure()
        env:
          WEBHOOK_PROD: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
          WEBHOOK_DEV: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL_DEV }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 한 건을 못 보내도(웹훅 시간 초과 · 지워진 웹훅의 404) 나머지는 보낸다. 이 단계는 bash -e 로 돌아서
          # 그냥 두면 먼저 보내는 dev 가 실패할 때 뒤의 prod 알림이 나가지 않는다. 못 보낸 것은 단계를 빨갛게 남긴다.
          # --fail 이 없으면 curl 은 HTTP 오류에도 성공으로 끝난다.
          failed=0
          send() { # <웹훅> <본문> — 보냈으면 sent=1
            sent=1
            jq -n --arg d "🔴 [백업 감시] $2"$'\n'"${RUN_URL}" \
              '{username: "infra-alert", embeds: [{color: 16711680, description: $d}], allowed_mentions: {parse: []}}' |
              curl -sS --fail -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' --data @- "$1" ||
              { echo "::error::Discord 로 못 보냈다 — ${2%%$'\n'*}"; failed=1; sent=0; }
          }
          for f in problems-*.txt; do
            [ -f "$f" ] || continue
            e="${f#problems-}"
            e="${e%.txt}"
            if [ "$e" != dev ]; then
              send "$WEBHOOK_PROD" "$(cat "$f")"
            elif [ -n "$WEBHOOK_DEV" ]; then
              send "$WEBHOOK_DEV" "$(cat "$f")"
              # 개발 채널 웹훅이 죽었어도(지워짐 · 시간 초과) 알림은 잃지 않는다 — 아래 secret 이 없을 때와 같이.
              [ "$sent" = 1 ] || send "$WEBHOOK_PROD" "$(cat "$f") (개발 채널 웹훅으로 못 보내 이 채널로 보냈다)"
            else
              # 개발 채널 웹훅이 없어도 알림은 잃지 않는다 — 운영 채널로 보내고 그렇게 적는다.
              send "$WEBHOOK_PROD" "$(cat "$f") (BACKUP_ALERT_WEBHOOK_URL_DEV 가 없어 이 채널로 보냈다)"
            fi
          done
          # 목록을 끝까지 못 읽었다(AWS 인증 · 조회 실패) — 어느 환경 문제인지 가릴 수 없어 운영 채널로.
          [ -f checked ] || send "$WEBHOOK_PROD" "감시 자체가 실패했다 — AWS 인증 · 버킷 목록 조회를 본다"
          exit "$failed"
