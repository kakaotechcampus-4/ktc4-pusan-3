name: OIDC 연결 확인

on:
  workflow_dispatch:
  push:
    branches:
      - ci/be-449-oidc-auth
    paths:
      - .github/workflows/oidc-test.yml

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      - run: aws sts get-caller-identity
